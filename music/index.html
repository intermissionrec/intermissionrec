  <!-- Smart Link quick-view modal -->
  <div id="smartlinkModal" class="sl-modal">
    <div class="sl-modal-backdrop"></div>
    <div class="sl-modal-content">
      <button class="sl-modal-close" aria-label="Затвори">&times;</button>
      <div class="sl-modal-left">
        <div class="sl-modal-cover">
          <img id="slModalCoverImg" src="" alt="">
        </div>
        <div class="sl-modal-info">
          <h2 id="slModalTitle"></h2>
          <p id="slModalArtist"></p>
        </div>
      </div>
      <div class="sl-modal-right" id="slModalLinks"></div>
    </div>
  </div>

  <script>
  (function () {
    var modal = document.getElementById('smartlinkModal');
    var closeBtn = modal.querySelector('.sl-modal-close');
    var backdrop = modal.querySelector('.sl-modal-backdrop');
    var coverImg = document.getElementById('slModalCoverImg');
    var titleEl = document.getElementById('slModalTitle');
    var artistEl = document.getElementById('slModalArtist');
    var linksEl = document.getElementById('slModalLinks');

    var prefetchCache = {};

    function renderModal(html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var coverSrc = doc.querySelector('.cover-card img');
      var title = doc.querySelector('.copy h1');
      var artist = doc.querySelector('.copy p');
      var platformLinks = doc.querySelectorAll('.music-links .platform-link');

      coverImg.src = coverSrc ? coverSrc.getAttribute('src') : '';
      coverImg.alt = title ? title.textContent : '';
      titleEl.textContent = title ? title.textContent : '';
      artistEl.textContent = artist ? artist.textContent : '';
      artistEl.style.display = (artist && artist.textContent) ? 'block' : 'none';

      linksEl.innerHTML = '';
      platformLinks.forEach(function (a) {
        var href = a.getAttribute('href');
        if (!href) {
          // Not a real streaming link - e.g. the disabled "Coming soon"
          // pill a not-yet-released smart link shows instead of platform
          // buttons (see release_publisher.ps1's Render-SmartLinkPage).
          // Reproduce it here as the same non-clickable pill rather than
          // building an <a> with no real href - setting .href to null
          // coerces to the literal string "null", which is what was
          // sending clicks to /music/null.
          var placeholder = document.createElement('span');
          placeholder.className = 'platform-link';
          placeholder.setAttribute('aria-disabled', 'true');
          placeholder.textContent = a.textContent;
          linksEl.appendChild(placeholder);
          return;
        }
        var newA = document.createElement('a');
        newA.href = href;
        newA.className = 'platform-link';
        newA.target = '_blank';
        newA.rel = 'noopener noreferrer';
        newA.textContent = a.textContent;
        linksEl.appendChild(newA);
      });

      modal.classList.add('is-open');
      document.body.classList.add('modal-open');
      document.body.style.overflow = 'hidden';
    }

    function openModal(url) {
      // already prefetched - render instantly, no network wait at all
      if (prefetchCache[url]) {
        renderModal(prefetchCache[url]);
        return;
      }

      // not prefetched yet (e.g. clicked before background loading
      // finished) - fall back to fetching it live, same as before
      fetch(url)
        .then(function (res) {
          if (!res.ok) throw new Error('Failed to load');
          return res.text();
        })
        .then(function (html) {
          prefetchCache[url] = html;
          renderModal(html);
        })
        .catch(function () {
          // if anything goes wrong, fall back to a normal navigation
          window.location.href = url;
        });
    }

    // Prefetches every smart-link card currently in the DOM - called
    // once after the initial spinner cards are ready, and again once
    // the artist rows finish loading (see buildArtistReleaseRows
    // below), since most of the page's cards don't exist yet at the
    // time of the first call.
    function prefetchAllSmartLinks() {
      document.querySelectorAll('.music-card').forEach(function (card) {
        var url = card.getAttribute('href');
        if (!url || prefetchCache[url]) return;
        fetch(url)
          .then(function (res) {
            if (!res.ok) throw new Error('Failed to load');
            return res.text();
          })
          .then(function (html) {
            prefetchCache[url] = html;
          })
          .catch(function () {
            // silently ignore - openModal falls back to a live fetch
            // for this url if it's ever clicked
          });
      });
    }

    // Runs after the page transition overlay has already faded out
    // (700ms) rather than competing with it for load, so this doesn't
    // slow down the page feeling ready.
    setTimeout(prefetchAllSmartLinks, 1000);

    function closeModal() {
      modal.classList.remove('is-open');
      document.body.classList.remove('modal-open');
      document.body.style.overflow = '';
    }

    // Delegated (not bound per-card) so this keeps working for every
    // card added later - the artist rows below are built
    // asynchronously, well after this script runs. A click on a
    // spinner card that ISN'T currently centered re-centers it
    // instead of opening the modal (see the coverflow controller
    // below); every other .music-card opens the modal exactly as
    // before.
    document.addEventListener('click', function (e) {
      var card = e.target.closest('.music-card');
      if (!card) return;
      e.preventDefault();

      if (card.classList.contains('spinner-card') && window.__spinnerJustDragged) {
        window.__spinnerJustDragged = false;
        return;
      }

      if (card.classList.contains('spinner-card') && !card.classList.contains('is-active')) {
        if (window.__spinnerGoToCard) window.__spinnerGoToCard(card);
        return;
      }
      openModal(card.getAttribute('href'));
    });

    closeBtn.addEventListener('click', closeModal);
    backdrop.addEventListener('click', closeModal);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modal.classList.contains('is-open')) {
        closeModal();
      }
    });

    // ── Latest-releases circular spinner ────────────────────────────
    // An actual wheel: the 10 covers sit evenly spaced around a full
    // circle (36° apart), each rotated to face outward along its own
    // spot on the ring (rotateY(angle) translateZ(radius) - the
    // classic 3D-carousel technique), so it genuinely reads as a
    // spinning wheel rather than a flat stack of cards. Manual only
    // (no autoplay): prev/next arrows, dots, clicking a side card,
    // and swipe all rotate the wheel. Index 0 (the first card in the
    // markup) starts facing front, which is always the latest release
    // since the cards above are listed newest-first.
    function initSpinner() {
      var stage = document.getElementById('spinnerStage');
      if (!stage) return;
      var cards = Array.prototype.slice.call(stage.querySelectorAll('.spinner-card'));
      if (!cards.length) return;

      var dotsWrap = document.getElementById('spinnerDots');
      var prevBtn = document.querySelector('.spinner-arrow-prev');
      var nextBtn = document.querySelector('.spinner-arrow-next');
      var active = 0;
      var angleStep = 360 / cards.length;

      // The wheel's actual continuous rotation, in degrees. This is
      // the piece a "shortest-path-per-render" version was missing:
      // each card's transform is simply its own fixed slot angle
      // (i * angleStep) plus this one shared, ever-accumulating
      // value, so a step always turns the wheel by exactly one
      // angleStep in the direction it was already asked to go. Any
      // approach that instead recomputes each card's angle from
      // scratch (shortest wrap from the new active index) makes half
      // the wheel silently flip which way it "should" turn whenever
      // active crosses the halfway point, which reads as a weird
      // snap/readjustment instead of a continuous spin - this avoids
      // that entirely.
      var rotation = 0;

      cards.forEach(function (card, i) {
        var dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'spinner-dot';
        dot.setAttribute('aria-label', card.getAttribute('aria-label') || ('Издание ' + (i + 1)));
        dot.addEventListener('click', function () { goTo(i); });
        dotsWrap.appendChild(dot);
      });
      var dots = Array.prototype.slice.call(dotsWrap.querySelectorAll('.spinner-dot'));

      function render() {
        // Radius derived from the actual rendered card size plus a
        // fixed ~60px gap between adjacent covers (measured as the
        // straight-line distance between neighboring slots on the
        // ring), rather than a fraction of the stage width - keeps
        // the spacing consistent and modest instead of ballooning on
        // wide screens.
        var cardSize = cards[0].getBoundingClientRect().width || 200;
        var gap = 60;
        var halfStepRad = (angleStep / 2) * Math.PI / 180;
        var radius = (cardSize + gap) / (2 * Math.sin(halfStepRad));

        cards.forEach(function (card, i) {
          var theta = i * angleStep + rotation;
          var rad = theta * Math.PI / 180;
          var depth = Math.cos(rad); // 1 = facing the viewer, -1 = facing away

          card.classList.toggle('is-active', i === active);
          // Gentler opacity falloff than before - the shading below
          // is now what mainly reads as "depth", so cards don't also
          // need to fade toward transparent to sell it.
          card.style.opacity = String(0.6 + 0.4 * ((depth + 1) / 2));
          card.style.pointerEvents = depth > -0.5 ? 'auto' : 'none';
          card.style.zIndex = String(Math.round((depth + 1) * 500));
          // Shading on the sides of the wheel: a dark overlay
          // (painted via the --shade custom property, see CSS) that
          // grows the further a cover has rotated away from facing
          // the viewer. A curved (not linear) ramp so cards just one
          // slot over from center already read as visibly shaded,
          // instead of barely darkening until they're almost edge-on.
          var shadeBase = Math.max(0, (1 - depth) / 2);
          card.style.setProperty('--shade', String(Math.pow(shadeBase, 0.6) * 0.7));
          // The translateZ(-radius) before rotateY re-centers the
          // whole ring in depth around the stage's own plane, instead
          // of leaving the front card sitting at translateZ(+radius)
          // - i.e. shoved almost all the way up to the camera relative
          // to the 800px perspective. That mismatch (radius getting
          // close to the perspective distance) is what was blowing the
          // front cover up huge and warping it as it rotated through
          // center - this keeps the front card at natural size and
          // only the side/back cards recede into the distance.
          card.style.transform =
            'translate(-50%, -50%) translateZ(-' + radius + 'px) rotateY(' + theta + 'deg) translateZ(' + radius + 'px)';
        });

        dots.forEach(function (dot, i) { dot.classList.toggle('is-active', i === active); });
      }

      function goTo(index) {
        var n = cards.length;
        index = ((index % n) + n) % n;
        // Shortest signed distance (in index steps) from the current
        // active card to the target, wrapping around either end, so
        // a dot/arrow jump always turns the short way. rotation is
        // then nudged by exactly that many steps - never reset or
        // recomputed from an absolute angle - so it stays continuous
        // with whatever the wheel was already doing.
        var raw = index - active;
        if (raw > n / 2) raw -= n;
        if (raw < -n / 2) raw += n;
        active = index;
        rotation -= raw * angleStep;
        render();
      }

      // Arrow clicks step one card at a time, but each step plays a
      // full .5s CSS transition. Firing goTo() again mid-transition
      // (e.g. someone clicking "next" a few times quickly) doesn't
      // queue cleanly on its own - it restarts the transition from
      // wherever it currently is toward a new target, so a burst of
      // clicks never lets any single step actually finish. The wheel
      // ends up lurching partway through several steps and then
      // doing one big "catch-up" snap once the clicks stop - which
      // is exactly what reads as a random readjustment rather than a
      // real spin. Queuing one step at a time and only starting the
      // next after the previous one's transition has genuinely
      // finished (transitionend) fixes that: every click is still
      // honored, but the wheel always completes a clean, full step
      // before starting the next one.
      var animating = false;
      var awaitingSettle = false;
      var queuedSteps = 0;

      function performStep(delta) {
        animating = true;
        awaitingSettle = true;
        goTo(active + delta);
      }

      function stepBy(delta) {
        if (animating) {
          queuedSteps += delta;
          return;
        }
        performStep(delta);
      }

      stage.addEventListener('transitionend', function (e) {
        if (e.propertyName !== 'transform' || !awaitingSettle) return;
        // Every card fires its own transitionend for the same step -
        // awaitingSettle is cleared on the first one seen so the rest
        // are ignored instead of each trying to advance the queue.
        awaitingSettle = false;
        if (queuedSteps !== 0) {
          var next = queuedSteps > 0 ? 1 : -1;
          queuedSteps -= next;
          performStep(next);
        } else {
          animating = false;
        }
      });

      prevBtn.addEventListener('click', function () { stepBy(-1); });
      nextBtn.addEventListener('click', function () { stepBy(1); });

      // Exposed for the delegated click handler above, so clicking a
      // visible-but-not-centered card brings it to center instead of
      // opening the smart-link modal.
      window.__spinnerGoToCard = function (card) {
        var i = cards.indexOf(card);
        if (i !== -1) goTo(i);
      };

      // Basic swipe support on top of the arrows/dots/click controls.
      var startX = null;
      stage.addEventListener('touchstart', function (e) {
        startX = e.touches[0].clientX;
      }, { passive: true });
      stage.addEventListener('touchend', function (e) {
        if (startX === null) return;
        var dx = e.changedTouches[0].clientX - startX;
        startX = null;
        if (Math.abs(dx) < 40) return;
        stepBy(dx < 0 ? 1 : -1);
      });

      // Mouse drag-to-spin: press and drag left/right across the
      // stage to rotate the wheel, one card per `dragThreshold`
      // pixels of horizontal movement, so a long drag spins through
      // several covers in one motion instead of just nudging one
      // step like a click would. Mirrors the touch-swipe direction
      // above (drag left => next, drag right => previous).
      var isDragging = false;
      var dragLastX = 0;
      var dragAccum = 0;
      var dragTotal = 0;

      stage.addEventListener('mousedown', function (e) {
        isDragging = true;
        dragLastX = e.clientX;
        dragAccum = 0;
        dragTotal = 0;
        stage.classList.add('is-dragging');
        e.preventDefault();
      });

      window.addEventListener('mousemove', function (e) {
        if (!isDragging) return;
        var dx = e.clientX - dragLastX;
        dragLastX = e.clientX;
        dragAccum += dx;
        dragTotal += Math.abs(dx);

        var dragThreshold = 50;
        while (Math.abs(dragAccum) >= dragThreshold) {
          if (dragAccum > 0) {
            goTo(active - 1);
            dragAccum -= dragThreshold;
          } else {
            goTo(active + 1);
            dragAccum += dragThreshold;
          }
        }
      });

      window.addEventListener('mouseup', function () {
        if (!isDragging) return;
        isDragging = false;
        stage.classList.remove('is-dragging');
        // A drag that moved more than a few pixels shouldn't also
        // fire the click that opens/recenters the card under the
        // cursor - the delegated click handler checks this flag.
        window.__spinnerJustDragged = dragTotal > 6;
      });

      // Mouse-wheel-to-spin: scrolling while hovering the stage
      // rotates the wheel instead of scrolling the page, so the
      // wheel can be spun quickly without switching to drag/arrows.
      var wheelAccum = 0;
      var wheelIdleTimer = null;
      stage.addEventListener('wheel', function (e) {
        e.preventDefault();
        stage.classList.add('is-dragging'); // reuse the snappy-transition state
        clearTimeout(wheelIdleTimer);
        wheelIdleTimer = setTimeout(function () { stage.classList.remove('is-dragging'); }, 200);

        var delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
        wheelAccum += delta;

        var wheelThreshold = 60;
        while (Math.abs(wheelAccum) >= wheelThreshold) {
          if (wheelAccum > 0) {
            goTo(active + 1);
            wheelAccum -= wheelThreshold;
          } else {
            goTo(active - 1);
            wheelAccum += wheelThreshold;
          }
        }
      }, { passive: false });

      // The radius is derived from the stage's width, so a resize
      // (or an orientation change) needs a re-render to stay correct.
      var resizeTimer = null;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(render, 150);
      }, { passive: true });

      render();
    }
    initSpinner();

    // ── Per-artist release rows ────────────────────────────────────
    // Sorted the exact same way as the artist quick-view modal on
    // /artists/ (by rank, descending) - see openModal() in
    // artists.html. Up to 4 per artist, one fixed (non-scrolling) row
    // each.
    function buildArtistReleaseRows() {
      var wrap = document.getElementById('artistReleasesBand');
      if (!wrap) return;

      var manifestPromise = fetch('../assets/data/smartlinks.json')
        .then(function (res) {
          if (!res.ok) throw new Error('Failed to load smartlinks manifest');
          return res.json();
        });

      var artistsPromise = fetch('../artists/')
        .then(function (res) {
          if (!res.ok) throw new Error('Failed to load artists page');
          return res.text();
        })
        .then(function (html) {
          var doc = new DOMParser().parseFromString(html, 'text/html');
          return Array.prototype.slice.call(doc.querySelectorAll('.artist-tile')).map(function (tile) {
            var logoImg = tile.querySelector('.artist-tile-logo');
            return {
              name: tile.getAttribute('aria-label') || '',
              logo: logoImg ? logoImg.getAttribute('src') : ''
            };
          }).filter(function (a) { return a.name; });
        });

      Promise.all([manifestPromise, artistsPromise])
        .then(function (results) {
          var manifest = results[0];
          var artists = results[1];

          wrap.innerHTML = '';

          artists.forEach(function (artist) {
            var name = artist.name;
            var releases = manifest
              .filter(function (entry) { return entry.mainArtist === name; })
              .sort(function (a, b) { return b.rank - a.rank; })
              .slice(0, 4);

            if (!releases.length) return; // nothing released yet - no empty row

            var row = document.createElement('div');
            row.className = 'artist-release-row';

            // Uses the artist's own logo (same image as their tile on
            // /artists/) instead of typesetting their name, when one
            // is available - falls back to a plain text heading for
            // any tile that has no logo image set.
            if (artist.logo) {
              var logoImg = document.createElement('img');
              logoImg.className = 'artist-release-row-logo';
              logoImg.src = artist.logo;
              logoImg.alt = name;
              row.appendChild(logoImg);
            } else {
              var heading = document.createElement('h3');
              heading.className = 'artist-release-row-heading';
              heading.textContent = name;
              row.appendChild(heading);
            }

            var grid = document.createElement('div');
            grid.className = 'artist-release-row-grid';

            releases.forEach(function (rel) {
              var card = document.createElement('a');
              card.className = 'music-card artist-row-card';
              card.href = rel.url;
              card.rel = 'noopener noreferrer';
              card.setAttribute('aria-label', rel.title || '');
              card.style.setProperty('--track-image', "url('" + rel.cover + "')");

              var titleSpan = document.createElement('span');
              titleSpan.className = 'music-title';
              titleSpan.textContent = rel.title || '';
              card.appendChild(titleSpan);

              grid.appendChild(card);
            });

            row.appendChild(grid);
            wrap.appendChild(row);
          });

          if (!wrap.children.length) {
            wrap.innerHTML = '<p class="artist-releases-status">Все още няма издания.</p>';
          }

          // The artist cards above didn't exist when the page-load
          // prefetch ran - top up the cache now that they're here, so
          // clicking one opens the modal instantly too.
          prefetchAllSmartLinks();
        })
        .catch(function () {
          wrap.innerHTML = '<p class="artist-releases-status">Грешка при зареждане на изданията по артист.</p>';
        });
    }
    buildArtistReleaseRows();
  })();
  </script>
</body>
</html>
