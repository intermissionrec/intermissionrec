<body class="magazin">
  <!-- Snipcart install snippet - must sit right after the opening
       <body> tag per Snipcart's own docs. It injects its own
       hidden #snipcart div, loader script and stylesheet the first
       time the shopper interacts with the page (loadStrategy:
       "on-user-interaction"), so it costs nothing on first paint.
       publicApiKey below is a PLACEHOLDER - replace it once with the
       real public key from your Snipcart dashboard (Account ->
       API Keys -> Public API Key). The matching SECRET key goes in
       the INTER(MISSION) Editor's Credentials dialog instead (used
       only for the Discount Codes manager), never here. -->
  <script>
    window.SnipcartSettings = {
      publicApiKey: "REPLACE_WITH_YOUR_SNIPCART_PUBLIC_API_KEY",
      loadStrategy: "on-user-interaction",
      currency: "eur",
    };
    (function(){var c,d;(d=(c=window.SnipcartSettings).version)!=null||(c.version="3.0");var s,S;(S=(s=window.SnipcartSettings).timeoutDuration)!=null||(s.timeoutDuration=2750);var l,p;(p=(l=window.SnipcartSettings).domain)!=null||(l.domain="cdn.snipcart.com");var w,u;(u=(w=window.SnipcartSettings).protocol)!=null||(w.protocol="https");var m,g;(g=(m=window.SnipcartSettings).loadCSS)!=null||(m.loadCSS=!0);var y=window.SnipcartSettings.version.includes("v3.0.0-ci")||window.SnipcartSettings.version!="3.0"&&window.SnipcartSettings.version.localeCompare("3.4.0",void 0,{numeric:!0,sensitivity:"base"})===-1,f=["focus","mouseover","touchmove","scroll","keydown"];window.LoadSnipcart=o;document.readyState==="loading"?document.addEventListener("DOMContentLoaded",r):r();function r(){window.SnipcartSettings.loadStrategy?window.SnipcartSettings.loadStrategy==="on-user-interaction"&&(f.forEach(function(t){return document.addEventListener(t,o)}),setTimeout(o,window.SnipcartSettings.timeoutDuration)):o()}var a=!1;function o(){if(a)return;a=!0;let t=document.getElementsByTagName("head")[0],n=document.querySelector("#snipcart"),i=document.querySelector('src[src^="'.concat(window.SnipcartSettings.protocol,"://").concat(window.SnipcartSettings.domain,'"][src$="snipcart.js"]')),e=document.querySelector('link[href^="'.concat(window.SnipcartSettings.protocol,"://").concat(window.SnipcartSettings.domain,'"][href$="snipcart.css"]'));n||(n=document.createElement("div"),n.id="snipcart",n.setAttribute("hidden","true"),document.body.appendChild(n)),h(n),i||(i=document.createElement("script"),i.src="".concat(window.SnipcartSettings.protocol,"://").concat(window.SnipcartSettings.domain,"/themes/v").concat(window.SnipcartSettings.version,"/default/snipcart.js"),i.async=!0,t.appendChild(i)),!e&&window.SnipcartSettings.loadCSS&&(e=document.createElement("link"),e.rel="stylesheet",e.type="text/css",e.href="".concat(window.SnipcartSettings.protocol,"://").concat(window.SnipcartSettings.domain,"/themes/   </script>
  <div id="pageTransitionOverlay" class="page-transition-overlay"></div>
  <div class="page">
    <div data-include="../components/header.html"></div>

    <main>
      <section class="magazin-band">
        <div class="magazin-inner">
          <div class="magazin-heading">
            <div class="magazin-heading-text">
              <h1>Магазин</h1>
              <p>Официален мърч на INTER(MISSION).</p>
            </div>
            <button class="snipcart-checkout magazin-cart-btn platform-link">Кошница (<span class="snipcart-items-count">0</span>)</button>
          </div>

          <!--
            SECTIONS + ITEMS ARE MANAGED FROM THE APP NOW
            ──────────────────────────────────────────────
            The block between the two MAGAZIN:SECTIONS markers below
            is generated by the INTER(MISSION) Editor's "Web Store"
            tab (under WEBSITE in the sidebar) - Load Current Store,
            use the Sections/Items editors, then Publish Web Store
            Update. Don't hand-edit the structure in here; anything
            you type will just be overwritten on the next publish.

            Cart + checkout are handled entirely by Snipcart (see the
            install snippet up in <head>/<body> above) - each item
            below is a plain button.snipcart-add-item carrying
            data-item-id/name/price/url/image. Snipcart validates an
            order by re-fetching data-item-url (this page) and
            comparing it against what's in the shopper's cart, so the
            id/name/price baked in here must always match what's live
            - which is exactly what the app's Publish step keeps in
            sync. Discount codes are managed separately, from the
            same Web Store tab's "Manage Discount Codes" button
            (calls Snipcart's real Discounts API - no HTML involved).

            This page currently has NO link in the site nav (by
            design, for now) - it's only reachable at /magazin
            directly. Add <a href="../magazin">Магазин</a> to
            components/header.html's .nav whenever it's ready to go
            public.
          -->
          <div class="magazin-sections">
<!-- MAGAZIN:SECTIONS:START -->
      <section class="magazin-section" data-section-id="merch">
        <h2 class="magazin-section-title">Мърч</h2>
        <div class="magazin-grid">
          <div class="magazin-card">
            <div class="magazin-card-image" style="--product-image:url('')"></div>
            <h3 class="magazin-card-title">Тениска — лого</h3>
            <p class="magazin-card-price">40 €</p>
            <button class="snipcart-add-item platform-link" data-item-id="teniska-logo" data-item-name="Тениска — лого" data-item-price="40" data-item-url="https://intermissionrec.com/magazin" data-item-image="">Купи</button>
          </div>

          <div class="magazin-card">
            <div class="magazin-card-image" style="--product-image:url('')"></div>
            <h3 class="magazin-card-title">Худи — лого</h3>
            <p class="magazin-card-price">80 €</p>
            <button class="snipcart-add-item platform-link" data-item-id="hudi-logo" data-item-name="Худи — лого" data-item-price="80" data-item-url="https://intermissionrec.com/magazin" data-item-image="">Купи</button>
          </div>

          <div class="magazin-card">
            <div class="magazin-card-image" style="--product-image:url('')"></div>
            <h3 class="magazin-card-title">Винил — cold summer</h3>
            <p class="magazin-card-price">60 €</p>
            <button class="snipcart-add-item platform-link" data-item-id="vinil-cold-summer" data-item-name="Винил — cold summer" data-item-price="60" data-item-url="https://intermissionrec.com/magazin" data-item-image="">Купи</button>
          </div>
        </div>
      </section>
<!-- MAGAZIN:SECTIONS:END -->
          </div>
        </div>
      </section>
    </main>
