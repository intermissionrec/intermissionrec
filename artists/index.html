<body class="artists">
  <div class="page">
    <div data-include="../components/header.html"></div>

    <main>
      <section class="artists-band">
                                                        <div class="artists-roster-grid" style="--artist-cols: 2;">
          <a class="artist-tile"
            href="#"
            aria-label="Vidrata" data-instagram="https://instagram.com/vidrata" data-youtube="https://youtube.com/@Vidrata" data-facebook="https://facebook.com/RealVidrata" data-soundcloud="https://soundcloud.com/alexvidrata" data-photo-zoom="124" data-photo-x="26" data-photo-y="46"
            style="--artist-image: url('../assets/images/artists/20260727045752-vidrata.jpg');">
            <img class="artist-tile-logo" src="../assets/images/artists/20260727045753-vidrata-logo.png" alt="Vidrata">
          </a>

          <a class="artist-tile"
            href="#"
            aria-label="игра на думи" data-instagram="https://instagram.com/igranadumimoika" data-youtube="https://youtube.com/@igranadumi" data-photo-zoom="118" data-photo-x="9" data-photo-y="57"
            style="--artist-image: url('../assets/images/artists/20260728003406-igra-na-dumi.jpg');">
            <img class="artist-tile-logo" src="../assets/images/artists/20260728003409-igra-na-dumi-logo.png" alt="игра на думи">
          </a>
        </div>
      
      
      
      
      
      
      </section>
    </main>

    <div data-include="../components/footer.html"></div>
  </div>

  <script src="../assets/script.js" defer></script>

  <!-- Artist quick-view modal -->
  <div id="artistModal" class="artist-modal" style="display:none;">
    <div class="artist-modal-backdrop"></div>
    <div class="artist-modal-content">
      <button class="artist-modal-close" aria-label="Затвори">&times;</button>

      <div class="artist-modal-photo">
        <div id="artistModalPhoto"></div>
        <div id="artistModalNameWrap"></div>
        <div class="artist-modal-social" id="artistModalSocial"></div>
      </div>

      <div class="artist-modal-info">
        <h3 class="artist-modal-releases-heading">Последни издания</h3>
      </div>

      <div class="artist-modal-releases" id="artistModalReleases"></div>
      <div class="artist-release-dots" id="artistReleaseDots"></div>
    </div>
  </div>

  <script>
  (function () {
    var modal = document.getElementById('artistModal');
    var closeBtn = modal.querySelector('.artist-modal-close');
    var backdrop = modal.querySelector('.artist-modal-backdrop');
    var photoImg = document.getElementById('artistModalPhoto');
    var nameWrap = document.getElementById('artistModalNameWrap');
    var socialWrap = document.getElementById('artistModalSocial');
    var releasesWrap = document.getElementById('artistModalReleases');
    var dotsWrap = document.getElementById('artistReleaseDots');

    var socialIcons = {
      instagram: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"></rect><circle cx="12" cy="12" r="5"></circle><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle></svg>',
      youtube: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="4"/><polygon points="10,9 16,12 10,15" fill="currentColor" stroke="none"/></svg>',
      facebook: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h-2a4 4 0 0 0-4 4v3H7v4h2v7h4v-7h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>',
      twitter: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l7.5 9.5L4.5 20h2.3l6-6.8L18 20h2l-8-10.2L18.7 4h-2.3l-5.5 6.2L8 4z"/></svg>',
      soundcloud: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 15v3M5 13v5M8 11v7M11 9v9M14 8v8h6a3 3 0 0 0 0-6 4 4 0 0 0-7.5-1.5"/></svg>'
    };

    function applyPhotoFraming(coverUrl, zoomPercent, xPercent, yPercent) {
      photoImg.style.backgroundImage = "url('" + coverUrl + "')";

      var loader = new Image();
      loader.onload = function () {
        var contW = photoImg.offsetWidth || photoImg.parentElement.offsetWidth;
        var contH = photoImg.offsetHeight || photoImg.parentElement.offsetHeight;
        var imgW = loader.naturalWidth;
        var imgH = loader.naturalHeight;
        if (!imgW || !imgH || !contW || !contH) return;

        var coverScale = Math.max(contW / imgW, contH / imgH);
        var totalScale = coverScale * (zoomPercent / 100);
        var sizeWidthPercent = (imgW * totalScale / contW) * 100;
        var sizeHeightPercent = (imgH * totalScale / contH) * 100;

        photoImg.style.backgroundSize = sizeWidthPercent + '% ' + sizeHeightPercent + '%';
        photoImg.style.backgroundPosition = xPercent + '% ' + yPercent + '%';
      };
      loader.src = coverUrl;
    }

    function openModal(tile) {
      var name = tile.getAttribute('aria-label') || '';

      var style = tile.getAttribute('style') || '';
      var imgMatch = style.match(/--artist-image:\s*url\('([^']*)'\)/);
      var coverUrl = imgMatch ? imgMatch[1] : '';

      // desktop and mobile have their own independently-set zoom/position
      // values, since their banners are completely different shapes
      var isDesktop = window.matchMedia('(min-width: 769px)').matches;
      var zoomAttr = isDesktop ? 'data-photo-zoom' : 'data-photo-zoom-m';
      var xAttr = isDesktop ? 'data-photo-x' : 'data-photo-x-m';
      var yAttr = isDesktop ? 'data-photo-y' : 'data-photo-y-m';

      var zoomPercent = parseFloat(tile.getAttribute(zoomAttr)) || 100;
      var xPercent = parseFloat(tile.getAttribute(xAttr));
      var yPercent = parseFloat(tile.getAttribute(yAttr));
      if (isNaN(xPercent)) xPercent = 50;
      if (isNaN(yPercent)) yPercent = 50;

      var logoImg = tile.querySelector('.artist-tile-logo');
      if (logoImg) {
        nameWrap.innerHTML = '<img class="artist-modal-logo" src="' + logoImg.getAttribute('src') + '" alt="' + name + '">';
      } else {
        nameWrap.innerHTML = '<h2 class="artist-modal-name"></h2>';
        nameWrap.querySelector('.artist-modal-name').textContent = name;
      }

      socialWrap.innerHTML = '';
      Object.keys(socialIcons).forEach(function (key) {
        var url = tile.getAttribute('data-' + key);
        if (url) {
          var a = document.createElement('a');
          a.href = url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.className = 'artist-modal-social-link';
          a.setAttribute('aria-label', key);
          a.innerHTML = socialIcons[key];
          socialWrap.appendChild(a);
        }
      });

      releasesWrap.innerHTML = '<p class="artist-modal-status">Зареждане...</p>';
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
      applyPhotoFraming(coverUrl, zoomPercent, xPercent, yPercent);

      fetch('../assets/data/smartlinks.json')
        .then(function (res) {
          if (!res.ok) throw new Error('Failed to load');
          return res.json();
        })
        .then(function (data) {
          var matches = data.filter(function (entry) { return entry.mainArtist === name; });
          matches.sort(function (a, b) { return b.rank - a.rank; });
          matches = matches.slice(0, 5);

          releasesWrap.innerHTML = '';
          dotsWrap.innerHTML = '';
          if (matches.length === 0) {
            releasesWrap.innerHTML = '<p class="artist-modal-status">Все още няма издания.</p>';
            return;
          }

          function makeCard(rel, isClone) {
            var card = document.createElement('a');
            card.className = 'artist-release-card';
            card.href = rel.url;
            card.title = rel.title;
            if (isClone) card.setAttribute('data-clone', 'true');
            card.innerHTML = '<span class="artist-release-cover" style="background-image:url(\'' + rel.cover + '\')"></span>';
            return card;
          }

          matches.forEach(function (rel) {
            releasesWrap.appendChild(makeCard(rel, false));
          });

          // clones at both ends so swiping past either edge lands somewhere,
          // then we instantly (no animation) jump to the real matching item
          // on the other side - creating a seamless loop in both directions.
          // DOM order becomes: [clone-of-last, real-1..real-5, clone-of-first]
          // so every real item's DOM position is its own index + 1.
          if (matches.length > 1) {
            releasesWrap.insertBefore(makeCard(matches[matches.length - 1], true), releasesWrap.firstChild);
            releasesWrap.appendChild(makeCard(matches[0], true));
          }

          matches.forEach(function (rel, i) {
            var dot = document.createElement('span');
            dot.className = 'artist-release-dot';
            if (i === 0) dot.classList.add('active');
            dot.addEventListener('click', function () {
              var card = releasesWrap.children[i + 1];
              if (card) card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            });
            dotsWrap.appendChild(dot);
          });

          if (matches.length > 1) {
            var startWidth = releasesWrap.clientWidth;
            if (startWidth) {
              releasesWrap.style.scrollBehavior = 'auto';
              releasesWrap.scrollLeft = startWidth * 1;
              releasesWrap.style.scrollBehavior = '';
            }
          }

          var scrollTimeout = null;
          function updateCarouselPosition() {
            var cardWidth = releasesWrap.clientWidth;
            if (!cardWidth) return;
            var domIndex = Math.round(releasesWrap.scrollLeft / cardWidth);
            var realIndex = domIndex - 1;

            if (domIndex <= 0) {
              releasesWrap.style.scrollBehavior = 'auto';
              releasesWrap.scrollLeft = cardWidth * matches.length;
              releasesWrap.style.scrollBehavior = '';
              realIndex = matches.length - 1;
            } else if (domIndex >= matches.length + 1) {
              releasesWrap.style.scrollBehavior = 'auto';
              releasesWrap.scrollLeft = cardWidth * 1;
              releasesWrap.style.scrollBehavior = '';
              realIndex = 0;
            }

            var dots = dotsWrap.querySelectorAll('.artist-release-dot');
            dots.forEach(function (d, i) { d.classList.toggle('active', i === realIndex); });
          }

          releasesWrap.addEventListener('scroll', function () {
            if (scrollTimeout) clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(updateCarouselPosition, 30);
          });

          // fires the instant the browser considers scrolling truly finished -
          // more precise than the debounced fallback above, where supported
          releasesWrap.addEventListener('scrollend', function () {
            if (scrollTimeout) clearTimeout(scrollTimeout);
            updateCarouselPosition();
          });
        })
        .catch(function () {
          releasesWrap.innerHTML = '<p class="artist-modal-status">Грешка при зареждане на изданията.</p>';
        });
    }

    function closeModal() {
      modal.style.display = 'none';
      document.body.style.overflow = '';
    }

    document.querySelectorAll('.artist-tile').forEach(function (tile) {
      tile.addEventListener('click', function (e) {
        e.preventDefault();
        openModal(tile);
      });
    });

    closeBtn.addEventListener('click', closeModal);
    backdrop.addEventListener('click', closeModal);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modal.style.display !== 'none') {
        closeModal();
      }
    });
  })();
  </script>
</body>
</html>
