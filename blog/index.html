<body class="blog">
  <div id="pageTransitionOverlay" class="page-transition-overlay"></div>
  <div class="page">
    <div data-include="../components/header.html"></div>

    <main>
      <section class="blog-band">
        <div class="blog-inner">
          <div class="blog-heading">
            <h1>Блог</h1>
            <p>Новини, съобщения и разкази зад кулисите на INTER(MISSION).</p>
          </div>

          <!--
            POSTS ARE MANAGED BY HAND
            ──────────────────────────────────────────────────────
            No app/CMS support for the blog yet, so a new post is two
            manual steps:

              1. Add a new folder under /blog/ named
                 dd-mm-yyyy-latinized-slugified-title, containing its
                 own index.html - copy
                 blog/31-08-2026-dobre-doshli-v-bloga/index.html as
                 the starting point and edit the title/date/author/
                 body. See that file's own comment for how photos get
                 placed within a post.

                 Slugify the title the same way release_publisher.ps1
                 does (Slugify / Transliterate-Cyrillic): lowercase,
                 Cyrillic transliterated letter-for-letter to Latin
                 (а→a, б→b, в→v, г→g, д→d, е→e, ж→zh, з→z, и→i, й→y,
                 к→k, л→l, м→m, н→n, о→o, п→p, р→r, с→s, т→t, у→u,
                 ф→f, х→h, ц→ts, ч→ch, ш→sh, щ→sht, ъ→a, ь→y, ю→yu,
                 я→ya), then spaces/punctuation collapsed to single
                 hyphens with none at either end.

              2. Add a matching .blog-card block below, newest post
                 first. A card is just a link to the post folder plus
                 a title/date+author/short excerpt - add a
                 .blog-card-image div as its first child (see the CSS
                 comment above .blog-card-image in style.css) if the
                 post has a cover photo to show in the list.
          -->
          <div class="blog-list">
            <a class="blog-card" href="31-08-2026-dobre-doshli-v-bloga/">
              <h2 class="blog-card-title">Добре дошли в блога</h2>
              <p class="blog-card-meta">31.08.2026 · INTER(MISSION)</p>
              <p class="blog-card-excerpt">Тук ще споделяме новини, съобщения и разкази зад кулисите на лейбъла - извън обичайните обяви за издания.</p>
            </a>
          </div>
        </div>
      </section>
    </main>

    <div data-include="../components/footer.html"></div>
  </div>

  <script type="module" src="../assets/logo3d.js"></script>
  <script src="../assets/script.js" defer></script>

  <!-- Lenis smooth scroll - same as /magazin, since blog posts are
       also variable-length scrolling content rather than a
       viewport-locked page. -->
  <script src="https://unpkg.com/lenis@1.3.26/dist/lenis.min.js"></script>
  <script>
    new Lenis({
      autoRaf: true,
      autoToggle: true,
      anchors: true,
      allowNestedScroll: true,
      naiveDimensions: true,
      stopInertiaOnNavigate: true,
      duration: 1.44
    });
  </script>
