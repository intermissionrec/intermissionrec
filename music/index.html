<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <title>Музика | INTER(MISSION)</title>
  <meta name="description" content="Слушай цялата музика на INTER(MISSION)">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://intermissionrec.com/music/">
  <meta property="og:site_name" content="INTER(MISSION)">
  <meta property="og:title" content="Музика | INTER(MISSION)">
  <meta property="og:description" content="Слушай цялата музика на INTER(MISSION)">
  <meta property="og:image" content="https://intermissionrec.com/assets/images/social/social-20260724234201.png">
  <meta property="og:locale" content="bg_BG">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Музика | INTER(MISSION)">
  <meta name="twitter:description" content="Слушай цялата музика на INTER(MISSION)">
  <meta name="twitter:image" content="https://intermissionrec.com/assets/images/social/social-20260724234201.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="../assets/head.js"></script>
  <link rel="stylesheet" href="../assets/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.26/dist/lenis.css">
</head>
<body class="music">
  <div id="pageTransitionOverlay" class="page-transition-overlay"></div>
  <div class="page">
    <div data-include="../components/header.html"></div>

    <main>
      <section class="music-band" id="music">
        <div class="latest-band">
          <h2 class="latest-heading">Най-нови издания</h2>
          <div class="latest-feature" id="latestFeature">
            <p class="artist-releases-status">Зареждане...</p>
          </div>
        </div>

        <div class="artist-releases-band" id="artistReleasesBand">
          <p class="artist-releases-status">Зареждане...</p>
        </div>
      </section>
    </main>

    <div data-include="../components/footer.html"></div>
  </div>

  <script type="module" src="../assets/logo3d.js"></script>
  <script src="../assets/script.js" defer></script>

  <!-- Lenis smooth scroll (site-wide) -->
  <script src="https://unpkg.com/lenis@1.3.26/dist/lenis.min.js"></script>
  <script>
    new Lenis({
      autoRaf: true,
      autoToggle: true,
      anchors: true,
      allowNestedScroll: true,
      naiveDimensions: true,
      stopInertiaOnNavigate: true,
      duration: 1.44
    });
  </script>

  <!-- Smart Link quick-view modal -->
  <div id="smartlinkModal" class="sl-modal">
    <div class="sl-modal-backdrop"></div>
    <div class="sl-modal-content">
      <button class="sl-modal-close" aria-label="Затвори">&times;</button>
      <div class="sl-modal-left">
        <div class="sl-modal-cover">
          <img id="slModalCoverImg" src="" alt="">
        </div>
        <div class="sl-modal-info">
          <h2 id="slModalTitle"></h2>
          <p id="slModalArtist"></p>
        </div>
      </div>
      <div class="sl-modal-right" id="slModalLinks"></div>
    </div>
  </div>

  <script>
  (function () {
    var modal = document.getElementById('smartlinkModal');
    var closeBtn = modal.querySelector('.sl-modal-close');
    var backdrop = modal.querySelector('.sl-modal-backdrop');
    var coverImg = document.getElementById('slModalCoverImg');
    var titleEl = document.getElementById('slModalTitle');
    var artistEl = document.getElementById('slModalArtist');
    var linksEl = document.getElementById('slModalLinks');

    var prefetchCache = {};
    var prefetching = {};

    function renderModal(html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var coverSrc = doc.querySelector('.cover-card img');
      var title = doc.querySelector('.copy h1');
      var artist = doc.querySelector('.copy p');
      var platformLinks = doc.querySelectorAll('.music-links .platform-link');

      coverImg.src = coverSrc ? coverSrc.getAttribute('src') : '';
      coverImg.alt = title ? title.textContent : '';
      titleEl.textContent = title ? title.textContent : '';
      artistEl.textContent = artist ? artist.textContent : '';
      artistEl.style.display = (artist && artist.textContent) ? 'block' : 'none';

      linksEl.innerHTML = '';
      platformLinks.forEach(function (a) {
        var href = a.getAttribute('href');
        if (!href) {
          // Not a real streaming link - e.g. the disabled "Coming soon"
          // pill a not-yet-released smart link shows instead of platform
          // buttons (see release_publisher.ps1's Render-SmartLinkPage).
          // Reproduce it here as the same non-clickable pill rather than
          // building an <a> with no real href - setting .href to null
          // coerces to the literal string "null", which is what was
          // sending clicks to /music/null.
          var placeholder = document.createElement('span');
          placeholder.className = 'platform-link';
          placeholder.setAttribute('aria-disabled', 'true');
          placeholder.textContent = a.textContent;
          linksEl.appendChild(placeholder);
          return;
        }
        var newA = document.createElement('a');
        newA.href = href;
        newA.className = 'platform-link';
        newA.target = '_blank';
        newA.rel = 'noopener noreferrer';
        newA.textContent = a.textContent;
        linksEl.appendChild(newA);
      });

      modal.classList.add('is-open');
      document.body.classList.add('modal-open');
      document.body.style.overflow = 'hidden';
    }

    function openModal(url) {
      // already prefetched - render instantly, no network wait at all
      if (prefetchCache[url]) {
        renderModal(prefetchCache[url]);
        return;
      }

      // not prefetched yet (e.g. clicked before background loading
      // finished) - fall back to fetching it live, same as before
      fetch(url)
        .then(function (res) {
          if (!res.ok) throw new Error('Failed to load');
          return res.text();
        })
        .then(function (html) {
          prefetchCache[url] = html;
          renderModal(html);
        })
        .catch(function () {
          // if anything goes wrong, fall back to a normal navigation
          window.location.href = url;
        });
    }

    // Prefetches every smart-link card currently in the DOM - called
    // once the latest-releases feature has rendered, and again once
    // the artist rows finish loading (see buildArtistReleaseRows
    // below), since those cards don't exist yet at the time of the
    // first call.
    function prefetchAllSmartLinks() {
      document.querySelectorAll('.music-card').forEach(function (card) {
        var url = card.getAttribute('href');
        if (!url || prefetchCache[url] || prefetching[url]) return;
        prefetching[url] = true;
        fetch(url)
          .then(function (res) {
            if (!res.ok) throw new Error('Failed to load');
            return res.text();
          })
          .then(function (html) {
            prefetchCache[url] = html;
          })
          .catch(function () {
            // silently ignore - openModal falls back to a live fetch
            // for this url if it's ever clicked
          });
      });
    }

    // Runs after the page transition overlay has already faded out
    // (700ms) rather than competing with it for load, so this doesn't
    // slow down the page feeling ready.
    setTimeout(prefetchAllSmartLinks, 1000);

    function closeModal() {
      modal.classList.remove('is-open');
      document.body.classList.remove('modal-open');
      document.body.style.overflow = '';
    }

    // Delegated (not bound per-card) so this keeps working for every
    // card added later - the latest-releases feature and the artist
    // rows below are built asynchronously, well after this script
    // runs. Every .music-card opens the smart-link modal.
    document.addEventListener('click', function (e) {
      var card = e.target.closest('.music-card');
      if (!card) return;
      e.preventDefault();

      openModal(card.getAttribute('href'));
    });

    closeBtn.addEventListener('click', closeModal);
    backdrop.addEventListener('click', closeModal);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modal.classList.contains('is-open')) {
        closeModal();
      }
    });

    // ── Latest releases: newest as a hero + the next nine in a 3x3 ──
    // Built from the same smartlinks.json manifest the artist rows use
    // (sorted by rank, newest first), so publishing a smart link updates
    // this section on its own - nothing in the page is hand-edited.
    // Cards keep the .music-card class so the delegated click handler
    // above opens the smart-link modal for them.
    var manifestPromise = fetch('../assets/data/smartlinks.json')
      .then(function (res) {
        if (!res.ok) throw new Error('Failed to load smartlinks manifest');
        return res.json();
      });

    function buildLatestFeature() {
      var wrap = document.getElementById('latestFeature');
      if (!wrap) return;

      manifestPromise.then(function (manifest) {
        var latest = manifest.slice()
          .sort(function (a, b) { return b.rank - a.rank; })
          .slice(0, 10);

        if (!latest.length) {
          wrap.innerHTML = '<p class="artist-releases-status">Все още няма издания.</p>';
          return;
        }

        function makeCard(rel, isHero) {
          var artistName = rel.artist || rel.mainArtist || '';
          var card = document.createElement('a');
          card.className = 'music-card latest-card' + (isHero ? ' latest-card--hero' : '');
          card.href = rel.url;
          card.rel = 'noopener noreferrer';
          card.setAttribute('aria-label', (rel.title || '') + (artistName ? ' - ' + artistName : ''));
          card.style.setProperty('--track-image', "url('" + rel.cover + "')");

          var titleWrap = document.createElement('span');
          titleWrap.className = 'music-title';

          var t = document.createElement('span');
          t.className = 'latest-title';
          t.textContent = rel.title || '';
          titleWrap.appendChild(t);

          if (artistName) {
            var a = document.createElement('span');
            a.className = 'latest-artist';
            a.textContent = artistName;
            titleWrap.appendChild(a);
          }

          card.appendChild(titleWrap);
          return card;
        }

        wrap.innerHTML = '';
        wrap.appendChild(makeCard(latest[0], true));

        var rest = document.createElement('div');
        rest.className = 'latest-rest';
        latest.slice(1).forEach(function (rel) { rest.appendChild(makeCard(rel, false)); });
        wrap.appendChild(rest);

        prefetchAllSmartLinks();
      }).catch(function () {
        wrap.innerHTML = '<p class="artist-releases-status">Грешка при зареждане на най-новите издания.</p>';
      });
    }
    buildLatestFeature();

    // ── Per-artist release rows ────────────────────────────────────
    // Sorted the exact same way as the artist quick-view modal on
    // /artists/ (by rank, descending) - see openModal() in
    // artists.html. Up to 4 per artist, one fixed (non-scrolling) row
    // each.
    function buildArtistReleaseRows() {
      var wrap = document.getElementById('artistReleasesBand');
      if (!wrap) return;

      var artistsPromise = fetch('../artists/')
        .then(function (res) {
          if (!res.ok) throw new Error('Failed to load artists page');
          return res.text();
        })
        .then(function (html) {
          var doc = new DOMParser().parseFromString(html, 'text/html');
          return Array.prototype.slice.call(doc.querySelectorAll('.artist-tile')).map(function (tile) {
            var logoImg = tile.querySelector('.artist-tile-logo');
            return {
              name: tile.getAttribute('aria-label') || '',
              logo: logoImg ? logoImg.getAttribute('src') : ''
            };
          }).filter(function (a) { return a.name; });
        });

      Promise.all([manifestPromise, artistsPromise])
        .then(function (results) {
          var manifest = results[0];
          var artists = results[1];

          wrap.innerHTML = '';

          artists.forEach(function (artist) {
            var name = artist.name;
            var releases = manifest
              .filter(function (entry) { return entry.mainArtist === name; })
              .sort(function (a, b) { return b.rank - a.rank; })
              .slice(0, 4);

            if (!releases.length) return; // nothing released yet - no empty row

            var row = document.createElement('div');
            row.className = 'artist-release-row';

            // Uses the artist's own logo (same image as their tile on
            // /artists/) instead of typesetting their name, when one
            // is available - falls back to a plain text heading for
            // any tile that has no logo image set.
            if (artist.logo) {
              // A separate full-width wrapper carries the #0a0a0a bar
              // background; the <img> itself keeps its original fixed
              // max-width/max-height so wide logos (e.g. игра на думи's)
              // render at their normal size instead of stretching to
              // fill the now-full-width bar.
              var logoWrap = document.createElement('div');
              logoWrap.className = 'artist-release-row-logo-wrap';

              var logoImg = document.createElement('img');
              logoImg.className = 'artist-release-row-logo';
              logoImg.src = artist.logo;
              logoImg.alt = name;
              // Every wrap is a fixed, identical 70px tall and centers
              // its logo/heading via flex align-items (in style.css), so
              // all artist bars line up the same height regardless of
              // which one has a logo vs. plain text. A couple of logo
              // files still sit a bit higher inside their own image than
              // the others do even once centered, so they read as
              // slightly misaligned next to the rest - shifts just the
              // rendered image content down via transform (on top of the
              // shared centering, doesn't affect layout/box height like
              // margin or padding would) rather than moving the whole bar.
              // Targeted per-artist rather than a general tweak.
              if (name === 'Leta Siren') {
                logoImg.style.transform = 'translateY(6px)';
                // Leta Siren's logo file itself renders smaller than the
                // others at the shared 42px max-height, so it gets a
                // taller cap (48px) just for this one artist.
                logoImg.style.maxHeight = '48px';
              } else if (name === 'игра на думи') {
                logoImg.style.transform = 'translateY(4px)';
              }
              logoWrap.appendChild(logoImg);
              row.appendChild(logoWrap);
            } else {
              var heading = document.createElement('h3');
              heading.className = 'artist-release-row-heading';
              heading.textContent = name;
              row.appendChild(heading);
            }

            var grid = document.createElement('div');
            // A 4-column CSS grid (style.css) sizes every cover the same
            // regardless of how many an artist has - a row with fewer
            // than 4 just leaves the remaining column(s) empty, no
            // per-count class needed here any more.
            grid.className = 'artist-release-row-grid';

            releases.forEach(function (rel) {
              var card = document.createElement('a');
              card.className = 'music-card artist-row-card';
              card.href = rel.url;
              card.rel = 'noopener noreferrer';
              card.setAttribute('aria-label', rel.title || '');
              card.style.setProperty('--track-image', "url('" + rel.cover + "')");

              var titleSpan = document.createElement('span');
              titleSpan.className = 'music-title';
              titleSpan.textContent = rel.title || '';
              card.appendChild(titleSpan);

              grid.appendChild(card);
            });

            row.appendChild(grid);
            wrap.appendChild(row);
          });

          if (!wrap.children.length) {
            wrap.innerHTML = '<p class="artist-releases-status">Все още няма издания.</p>';
          }

          // The artist cards above didn't exist when the page-load
          // prefetch ran - top up the cache now that they're here, so
          // clicking one opens the modal instantly too.
          prefetchAllSmartLinks();
        })
        .catch(function () {
          wrap.innerHTML = '<p class="artist-releases-status">Грешка при зареждане на изданията по артист.</p>';
        });
    }
    buildArtistReleaseRows();
  })();
  </script>
</body>
</html>
