  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<body class="home">
  <div id="pageTransitionOverlay" class="page-transition-overlay"></div>
  <div class="page">
    <div data-include="./components/header.html"></div>

    <main>
      <section class="feature-band">
        <div class="feature">
          <a class="cover-card" href="https://intermissionrec.com/cold-summer/" rel="noopener noreferrer" aria-label="BANDOLERO">
            <img src="./assets/images/releases/cold-summer.jpg" alt="Cover art for cold summer" width="451" height="451">
          </a>

          <div class="copy">
            <h1>cold summer</h1>
            <p>Слушайте новото англоезично EP на игра на думи - вече налично във всички платформи!</p>
          </div>
        </div>
      </section>

      <!-- Auto-synced by the release publisher tool going forward -
           the cards below are placeholders seeded from the current
           /music catalog until that sync is wired up. -->
      <section class="releases-marquee-band">
        <div class="releases-marquee-head">
          <h2>Нови издания</h2>
        </div>
        <div class="releases-marquee-viewport" id="releasesMarquee">
          <div class="releases-marquee-track" id="releasesMarqueeTrack">
            <a class="release-marquee-card" href="https://intermissionrec.com/cold-summer/" aria-label="cold summer">
              <img class="release-marquee-cover" src="./assets/images/releases/cold-summer.jpg" alt="" loading="lazy">
              <span class="release-marquee-title">cold summer</span>
            </a>
            <a class="release-marquee-card" href="https://intermissionrec.com/bandolero/" aria-label="BANDOLERO">
              <img class="release-marquee-cover" src="./assets/images/releases/bandolero.jpg" alt="" loading="lazy">
              <span class="release-marquee-title">BANDOLERO</span>
            </a>
            <a class="release-marquee-card" href="https://intermissionrec.com/vsichko/" aria-label="всичко">
              <img class="release-marquee-cover" src="./assets/images/releases/vsichko.jpg" alt="" loading="lazy">
              <span class="release-marquee-title">всичко</span>
            </a>
            <a class="release-marquee-card" href="https://intermissionrec.com/nepoznati-ulici/" aria-label="непознати улици">
              <img class="release-marquee-cover" src="./assets/images/releases/nepoznati-ulici.jpg" alt="" loading="lazy">
              <span class="release-marquee-title">непознати улици</span>
            </a>
            <a class="release-marquee-card" href="https://intermissionrec.com/redbul/" aria-label="редбул">
              <img class="release-marquee-cover" src="./assets/images/releases/redbul.jpg" alt="" loading="lazy">
              <span class="release-marquee-title">редбул</span>
            </a>
            <a class="release-marquee-card" href="https://intermissionrec.com/belya/" aria-label="БЕЛЯ">
              <img class="release-marquee-cover" src="./assets/images/releases/belya.jpg" alt="" loading="lazy">
              <span class="release-marquee-title">БЕЛЯ</span>
            </a>
            <a class="release-marquee-card" href="https://intermissionrec.com/bez-snimki/" aria-label="БЕЗ СНИМКИ">
              <img class="release-marquee-cover" src="./assets/images/releases/bez-snimki.jpg" alt="" loading="lazy">
              <span class="release-marquee-title">БЕЗ СНИМКИ</span>
            </a>
            <a class="release-marquee-card" href="https://intermissionrec.com/koi-go-prai/" aria-label="КОЙ ГО ПРАЙ">
              <img class="release-marquee-cover" src="./assets/images/releases/koi-go-prai.jpg" alt="" loading="lazy">
              <span class="release-marquee-title">КОЙ ГО ПРАЙ</span>
            </a>
            <a class="release-marquee-card" href="https://intermissionrec.com/legato/" aria-label="LEGATO">
              <img class="release-marquee-cover" src="./assets/images/releases/legato.jpg" alt="" loading="lazy">
              <span class="release-marquee-title">LEGATO</span>
            </a>
            <a class="release-marquee-card" href="https://intermissionrec.com/instagram-modeli/" aria-label="INSTAGRAM МОДЕЛИ">
              <img class="release-marquee-cover" src="./assets/images/releases/instagram-modeli.jpg" alt="" loading="lazy">
              <span class="release-marquee-title">INSTAGRAM МОДЕЛИ</span>
            </a>
          </div>
        </div>
      </section>

      <!-- Populated client-side from assets/data/instagram-feed.json,
           which the release publisher tool will generate at publish
           time using its existing Instagram Graph API credentials. -->
      <section class="ig-feed-band">
        <div class="ig-feed-inner">
          <div class="ig-feed-head">
            <h2>В Instagram</h2>
            <a class="ig-feed-handle" href="https://instagram.com/intermissionrecords" target="_blank" rel="noopener noreferrer">@intermissionrecords</a>
          </div>
          <div class="ig-feed-grid" id="igFeedGrid"></div>
        </div>
      </section>
    </main>

    <div data-include="./components/footer.html"></div>
  </div>
  <script type="module" src="./assets/logo3d.js"></script>
  <script src="./assets/script.js" defer></script>
</body>
</html>
