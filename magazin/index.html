          <!--
            SECTIONS + ITEMS ARE MANAGED FROM THE APP NOW
            ──────────────────────────────────────────────
            The block between the two MAGAZIN:SECTIONS markers below
            is generated by the INTER(MISSION) Editor's "Web Store"
            tab (under WEBSITE in the sidebar) - Load Current Store,
            use the Sections/Items editors, then Publish Web Store
            Update. Don't hand-edit the structure in here; anything
            you type will just be overwritten on the next publish.

            Cart + checkout are Stripe-direct, no third-party cart
            platform involved. Each item below is a plain
            button.magazin-add-to-cart carrying data-item-id; the
            cart drawer itself, and all the JS that drives it
            (add/remove/qty, checkout, the nav badge), are shared
            site-wide in assets/script.js - not page-specific to this
            file - and the drawer's own markup lives in
            components/footer.html so it's present on every page too.
            The script#magazin-catalog JSON block below (inside the
            managed markers) is the single source of truth for
            names/prices/digital-or-not - script.js reads it directly
            when it's already on the page (true here), or fetches this
            exact page for it when the cart is opened from anywhere
            else on the site. The Cloudflare Worker also re-fetches
            this same page and reads that same block before creating a
            Stripe Checkout Session, so the id/name/price/digital flag
            baked in here must always match what's live, which is
            exactly what the app's Publish step keeps in sync. Discount
            codes are managed separately, from the same Web Store tab's
            "Manage Discount Codes" button (calls Stripe's real
            Coupons/Promotion Codes API directly - no HTML involved),
            and are entered by the shopper on Stripe's own hosted
            Checkout page.

            The site-wide cart icon/badge lives in the nav
            (components/header.html's .nav-cart) and opens this same
            drawer in place from anywhere on the site - see
            setupNavCartLink() in assets/script.js - so this page no
            longer needs its own separate "Кошница" button next to the
            heading above.
          -->
          <div class="magazin-sections">
<!-- MAGAZIN:SECTIONS:START -->
      <script type="application/json" id="magazin-catalog">{"items":{"leta-siren-do-kraq-digital":{"name":"Leta Siren - До края (дигитално копие)","price":2,"weight":0.3,"description":"Дебютният солов сингъл на Leta Siren, \"До края\", е вече наличен!","contents":"- WAV 16-bit 44,1KHz (стандартна)\r\n- WAV 16-bit 44,1KHz (забързана)\r\n- cover art JPEG","image":"../assets/images/magazin/20260903132323-leta-siren-do-kraya-digitalno-kopie.jpg","images":["../assets/images/magazin/20260903132323-leta-siren-do-kraya-digitalno-kopie.jpg"],"digital":true,"availability":"preorder"}},"promoCodesEnabled":false}</script>
