  <style>
    body.error-404 {
      --amber: #f2f2f2;
      --danger: #e05a4e;
      --face: #cccccc;
    }

    .error-404-band {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 24px 20px 36px;
      background: var(--bg-alt);
    }

    .error-404-inner {
      width: min(100%, 1200px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      text-align: center;
    }

    .error-404-eyebrow {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: clamp(3rem, 11vw, 5.5rem);
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--amber);
    }

    .error-404-copy h1 {
      margin: 6px 0 0;
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(1.5rem, 3.2vw, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .error-404-lead {
      margin: 12px auto 0;
      max-width: 520px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
    }

    .error-404-game {
      position: relative;
      width: 100%;
      max-width: 1200px;
      background: #060606;
      border-radius: var(--radius);
      overflow: hidden;
    }

    /* Long-pressing anywhere in the game (canvas, overlay text, picker
       thumbnails) was triggering the browser's native text-select/callout
       menu on mobile, which felt like a tap delay. Locking selection and the
       iOS callout down across the whole game area stops that. */
    .error-404-game,
    .error-404-game * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
    }

    #runnerCanvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 800 / 300;
      touch-action: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      image-rendering: pixelated;
      /* Desaturates the whole scene (sprites, ground line, background) so it
         reads as true greyscale instead of the slightly blue/purple-tinted
         palette the character/ground colors had. */
      filter: grayscale(1);
    }

    .error-404-hud {
      position: absolute;
      top: 14px;
      right: 18px;
      display: flex;
      gap: 16px;
      font-family: 'Press Start 2P', monospace;
      font-weight: 400;
      font-size: 12px;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      color: rgba(242, 242, 242, .9);
      text-shadow: 0 1px 4px rgba(0, 0, 0, .6);
      pointer-events: none;
    }

    #runnerHiScore { color: var(--face); }
    #runnerHiScore.is-hidden { visibility: hidden; }
    #runnerScore.is-flash-off { visibility: hidden; }

    .error-404-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 20px;
      text-align: center;
      background: rgba(6, 6, 6, .4);
      cursor: pointer;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .error-404-overlay[hidden] { display: none; }

    .runner-overlay-title {
      margin: 0;
      font-family: 'Press Start 2P', monospace;
      font-weight: 400;
      font-size: clamp(0.9rem, 2.6vw, 1.3rem);
      line-height: 1.5;
      color: #fff;
      letter-spacing: 0;
    }

    .error-404-overlay p:not(.runner-overlay-title) {
      margin: 0;
      color: rgba(242, 242, 242, .85);
      font-family: 'Press Start 2P', monospace;
      font-weight: 400;
      font-size: 10px;
      line-height: 1.8;
      letter-spacing: 0;
    }

    .error-404-hint {
      margin: 0;
      color: var(--muted-2, #555);
      font-size: 13px;
    }

    .error-404-home-link {
      margin-top: 4px;
    }

    @media (max-width: 919.98px) {
      .error-404-band { padding: 56px 20px 72px; }
    }

    /* Mobile: taller/more-vertical game canvas (matches the JS mobile logical
       size below - both must stay in sync or the pixel art stretches). Overlay
       is also tightened up so its text has room inside the shorter box on
       narrow phones instead of overflowing past the game frame. */
    @media (max-width: 640px) {
      #runnerCanvas {
        aspect-ratio: 640 / 640;
      }
      .error-404-overlay {
        padding: 14px;
        gap: 6px;
      }
      .runner-picker {
        gap: 14px;
        margin: 2px 0 4px;
      }
      .runner-picker-thumb {
        width: 42px;
        height: 60px;
      }
    }

    .runner-picker {
      display: flex;
      gap: 18px;
      margin: 4px 0 8px;
    }

    .runner-picker-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px 14px 8px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(17, 17, 17, .8);
      color: var(--muted, #bfbfbf);
      font: inherit;
      cursor: pointer;
      transition: border-color .15s ease, color .15s ease, background .15s ease;
    }

    .runner-picker-btn:hover { border-color: rgba(255, 255, 255, .25); }

    .runner-picker-btn.is-selected {
      color: #fff;
      background: rgba(201, 201, 201, .14);
    }

    .runner-picker-thumb {
      width: 48px;
      height: 70px;
      background-repeat: no-repeat;
      background-position: center bottom;
      background-size: contain;
      image-rendering: pixelated;
      /* Match the canvas's greyscale treatment - these thumbnails are plain
         CSS background-images, so the canvas's own filter doesn't reach them. */
      filter: grayscale(1);
    }

    .runner-picker-label {
      font-family: 'Press Start 2P', monospace;
      font-weight: 400;
      font-size: 9px;
      line-height: 1.6;
      letter-spacing: 0;
      white-space: normal;
      max-width: 78px;
      text-align: center;
    }
  </style>

  <script>
  (function () {
    var canvas = document.getElementById('runnerCanvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');

    // Mobile gets a taller world space (more vertical framing) instead of the
    // desktop's wide/short one - keeps the same 800-wide world so obstacle
    // spawn/gap/speed math is untouched, only the vertical canvas is taller.
    // Must stay in sync with the "aspect-ratio: 640 / 640" mobile media query above
    // (800 / 800 reduces to the same 1:1 ratio, keeping the 800-wide world intact).
    var IS_MOBILE = window.matchMedia('(max-width: 640px)').matches;
    var LOGICAL_W = 800, LOGICAL_H = IS_MOBILE ? 800 : 300;
    // The backing store has to be sized to the canvas's ACTUAL on-screen pixel
    // footprint (its CSS box size x the real devicePixelRatio), not to a fixed
    // LOGICAL_W-based constant. Those used to be unrelated numbers, so the
    // browser had to resample the whole canvas bitmap to fit the CSS box on
    // top of everything we drew - and that resample doesn't reliably stay
    // nearest-neighbor even with image-rendering: pixelated set.
    var rect = canvas.getBoundingClientRect();
    var dpr = rect.width ? (rect.width / LOGICAL_W) * (window.devicePixelRatio || 1) : Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(LOGICAL_W * dpr);
    canvas.height = Math.round(LOGICAL_H * dpr);
    ctx.scale(dpr, dpr);
    // Setting canvas.width/height above resets the ENTIRE 2D context state
    // back to its defaults - including imageSmoothingEnabled back to true.
    // It has to be turned off again after that reset, not before, or it's a
    // no-op and every drawImage call gets smoothed regardless of this flag.
    ctx.imageSmoothingEnabled = false;

    // On the square mobile frame, dead-centering the ground *line* leaves the
    // character (which stands on top of it, extending upward) looking too high -
    // only the line itself was centered. Nudging the line down by half the
    // character's on-screen height (~47 world px tall * 3.08 zoom) centers the
    // character + line together instead of just the line.
    var GROUND_Y = IS_MOBILE ? Math.round(LOGICAL_H / 2 + (47 * 3.08) / 2) : 232;
    var GRAVITY = 2200;
    // Every jump launches at the same speed (JUMP_VELOCITY) the instant you press -
    // no input delay waiting to see how long you'll hold. What makes a tap "short"
    // vs "long" is releaseJump(): an early release (still rising, within
    // SHORT_TAP_MAX) caps the upward speed down to LIGHT_JUMP_VELOCITY instead of
    // letting it keep climbing at the full launch speed, so a quick tap coasts up
    // to a lower, softer hop while holding past that gets the full jump.
    //   - collision boxes are inset by 4px on every edge, so clearing an obstacle of
    //     height H only requires rising (H - 8) world units.
    //   - the tallest obstacle is the 3-speaker pyramid stack (h=72, w=~62, needs a
    //     rise of ~64) since obstacles switched to real pre-drawn stack art instead
    //     of a fixed-height sprite tiled sideways. Peak height alone isn't what

    function updateHud() {

      // whatever it read the instant the blink started (still visibly
      // ticking off/on, just not re-counting) - the real score keeps
      // accumulating underneath the whole time regardless, so once the

      if (scoreEl && milestoneFlashActiveTimer <= 0) scoreEl.textContent = pad(score);

    function beep(freq, duration, type, gain) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        var osc = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        osc.type = type || 'square';
        osc.frequency.value = freq;
        g.gain.value = gain || 0.05;
        osc.connect(g);
        g.connect(audioCtx.destination);
        osc.start();
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playMilestoneChime() {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        var now = audioCtx.currentTime;
        var notes = [880, 1108.73, 1318.51];
        var noteGap = 0.075;
        for (var i = 0; i < notes.length; i++) {
          var osc = audioCtx.createOscillator();
          var g = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = notes[i];
          var t0 = now + i * noteGap;
          g.gain.setValueAtTime(0, t0);
          g.gain.linearRampToValueAtTime(0.05, t0 + 0.012);
          g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.28);
          osc.connect(g);
          g.connect(audioCtx.destination);
          osc.start(t0);
          osc.stop(t0 + 0.3);
        }
      } catch (e) {}
    }

    function duplicateObstacleCheck(type) {
      var count = 0;

    function pickObstacleType() {
      for (var tries = 0; tries < 10; tries++) {
        var type = OBSTACLE_KEYS[Math.floor(Math.random() * OBSTACLE_KEYS.length)];

    function spawnObstacle() {
      var type = pickObstacleType();

        size = 1;

      obstacles.push(ob);

      var minGap = Math.round(totalWidth * speedFactor + cfg.minGap * GAP_COEFFICIENT);

      if (state === 'idle') { startGame(); return; }
      if (state === 'dying') return;
      if (state === 'running' && player.onGround) {
        player.vy = JUMP_VELOCITY;
        player.onGround = false;
        player.jumpHeld = true;
        player.jumpPressTime = elapsed;
        player.fastFall = false;
        beep(560, 0.09, 'square', 0.045);
      }
    }

    function releaseJump() {
      if (!player || !player.jumpHeld) return;
      player.jumpHeld = false;
      var heldFor = elapsed - player.jumpPressTime;
      if (heldFor < SHORT_TAP_MAX) {
        if (player.vy < LIGHT_JUMP_VELOCITY) player.vy = LIGHT_JUMP_VELOCITY;
        player.fastFall = true;
      }
    }

    function updateIdle(dt) {
      groundOffset = (groundOffset + BASE_SPEED * dt) % 40;
      player.runTimer += dt;
      var frameInterval = 0.125;
      if (player.runTimer > frameInterval) {
        player.runTimer = 0;
        var frameCount = CHARACTERS[selectedChar].runFrames.length;
        player.runFrame = (player.runFrame + 1) % frameCount;
      }
    }

    function update(dt) {
      if (milestoneFlashActiveTimer > 0) {
        // Purely a visual callout on the score digits - gameplay (player,
        // obstacles, speed) keeps running normally underneath the whole
        // time, so this never pauses anything below, it only drives the
        // blink timing (see updateHud() for the frozen-display half of it).
        milestoneFlashActiveTimer -= dt;
        milestoneFlashTimer -= dt;
        if (milestoneFlashTimer <= 0) {
          milestoneFlashTimer += MILESTONE_FLASH_INTERVAL;
          milestoneFlashOn = !milestoneFlashOn;
          if (scoreEl) scoreEl.classList.toggle('is-flash-off', !milestoneFlashOn);
        }
        if (milestoneFlashActiveTimer <= 0) {
          milestoneFlashActiveTimer = 0;
          if (scoreEl) scoreEl.classList.remove('is-flash-off');
        }
      }

      elapsed += dt;
      distance += speed * dt;
      score = distance / SCORE_DISTANCE_DIVISOR;
      var speedStage = Math.floor(distance / SPEED_STAGE_DISTANCE);
      speed = Math.min(MAX_SPEED, BASE_SPEED + speedStage * SPEED_STEP);

      var g = (player.fastFall && player.vy >= 0) ? GRAVITY * FAST_FALL_GRAVITY_MULT : GRAVITY;
      player.vy += g * dt;
      player.y += player.vy * dt;
      if (player.y >= GROUND_Y) {
        player.y = GROUND_Y;
        player.vy = 0;
        player.onGround = true;
        player.jumpHeld = false;
        player.fastFall = false;
      }

      if (player.onGround) {
        player.runTimer += dt;
        var frameInterval = 0.125;
        if (player.runTimer > frameInterval) {
          player.runTimer = 0;
          var frameCount = CHARACTERS[selectedChar].runFrames.length;
          player.runFrame = (player.runFrame + 1) % frameCount;
        }
      }

      groundOffset = (groundOffset + speed * dt) % 40;

      for (var i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= speed * dt;
        if (obstacles[i].x + obstacles[i].w < -20) obstacles.splice(i, 1);
      }
      nextSpawnAt -= speed * dt;
      if (nextSpawnAt <= 0) spawnObstacle();

      var m = 4;
      var px1 = PLAYER_X + m, px2 = PLAYER_X + player.w - m;
      var py1 = player.y - player.h + m, py2 = player.y - m;
      for (var j = 0; j < obstacles.length; j++) {
        var o = obstacles[j];
        var hit = false;
        if (o.type === 'monitor') {
          // Test each row of the pyramid stack against its own tight box
          // instead of one rectangle spanning the whole stack's silhouette -
          // see MONITOR_TIERS' "bands" comment.
          var tier = MONITOR_TIERS[o.count] || MONITOR_TIERS[1];
          var oy0 = GROUND_Y - o.h;
          for (var b = 0; b < tier.bands.length; b++) {
            var band = tier.bands[b];
            var bx1 = o.x + band.x0 * MONITOR_SCALE + m, bx2 = o.x + band.x1 * MONITOR_SCALE - m;
            var by1 = oy0 + band.y0 * MONITOR_SCALE + m, by2 = oy0 + band.y1 * MONITOR_SCALE - m;
            if (px2 > bx1 && px1 < bx2 && py2 > by1 && py1 < by2) { hit = true; break; }
          }
        } else {
          var ox1 = o.x + m, ox2 = o.x + o.w - m;
          var oy1 = GROUND_Y - o.h + m, oy2 = GROUND_Y - m;
          hit = px2 > ox1 && px1 < ox2 && py2 > oy1 && py1 < oy2;
        }
        if (hit) {
          die();
          break;
        }
      }

      var milestone = Math.floor(score / SCORE_MILESTONE_STEP) * SCORE_MILESTONE_STEP;
      if (milestone > 0 && milestone !== player.lastMilestone) {
        player.lastMilestone = milestone;
        playMilestoneChime();
        // Show this exact crossing score right now, before the freeze-display
        // guard in updateHud() kicks in - otherwise the last number painted
        // would be whatever it read the frame before crossing the milestone.
        if (scoreEl) scoreEl.textContent = pad(score);
        milestoneFlashActiveTimer = MILESTONE_FLASH_SECONDS;
        milestoneFlashTimer = MILESTONE_FLASH_INTERVAL;
        milestoneFlashOn = true;
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
      ctx.fillStyle = '#060606';
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

      ctx.strokeStyle = COLORS.line;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y + 1);
      ctx.lineTo(LOGICAL_W, GROUND_Y + 1);
      ctx.stroke();

      ctx.fillStyle = 'rgba(55,55,67,0.85)';
      for (var x = -groundOffset; x < LOGICAL_W; x += 40) {
        ctx.fillRect(x, GROUND_Y + 6, 18, 2);
      }
    }

    function drawPlayer() {
      var c = CHARACTERS[selectedChar];
      var img, frame, offset, sh;
      if (player.onGround) {
        img = runImages[selectedChar];
        var fi = player.runFrame % c.runFrames.length;
        frame = c.runFrames[fi];
        offset = (c.runOffsets && c.runOffsets[fi]) || 0;
        sh = c.runSheetH;
      } else {
        img = jumpImages[selectedChar];
        var ji = player.vy < 0 ? 0 : 1;
        frame = c.jumpFrames[ji];
        offset = (c.jumpOffsets && c.jumpOffsets[ji]) || 0;
        sh = c.jumpSheetH;
      }
      if (!img || !img.complete || !img.naturalWidth) return;

      // Each run frame keeps the artist's own vertical placement within the sheet
      // (sy stays 0, full sheetH is drawn every time) - that's what gives the run
      // cycle its natural 1px-ish bob, since some frames sit a pixel higher than
      // others in the source art. We only correct the horizontal anchor (offset).
      var sx = frame[0], sw = frame[1] - frame[0] + 1;
      var scale = 1.25;
      var dw = sw * scale, dh = sh * scale;
      var dx = PLAYER_X + player.w / 2 - dw / 2 + offset * scale;
      var dy = Math.round(player.y - dh);
      ctx.drawImage(img, sx, 0, sw, sh, dx, dy, dw, dh);
    }

    var MIC_NATIVE_W = 23, MIC_NATIVE_H = 68;

    function drawObstacles() {
      obstacles.forEach(function (o) {
        if (o.type === 'monitor') {
          var tier = MONITOR_TIERS[o.count] || MONITOR_TIERS[1];
          var img = tier.img;
          if (!img || !img.complete || !img.naturalWidth) return;
          // The tier's own width/height (already the obstacle's collision
          // box, o.w/o.h) IS the sprite's footprint now - one pre-composed
          // stack image, no more tiling a single speaker sideways.
          var dy = GROUND_Y - o.h;
          ctx.drawImage(img, 0, 0, tier.w, tier.h, o.x, dy, o.w, o.h);
        } else {
          var img2 = micImg;
          if (!img2.complete || !img2.naturalWidth) return;
          var dh2 = o.h, dw2 = dh2 * (MIC_NATIVE_W / MIC_NATIVE_H);
          var dx2 = o.x + o.w / 2 - dw2 / 2;
          var dy2 = GROUND_Y - dh2;
          ctx.drawImage(img2, 0, 0, MIC_NATIVE_W, MIC_NATIVE_H, dx2, dy2, dw2, dh2);
        }
      });
    }

    // Camera zoom: renders the whole scene 40% bigger inside the same canvas, so the
    // action fills more of the frame instead of sitting in a lot of empty space. Anchored
    // on the player's x position and the ground line so neither drifts off-screen -
    // everything simply scales up around that point. Game logic (physics, spawn
    // positions, collisions) stays in the original 800x300 world space; only the picture
    // is zoomed.
    // Mobile gets a bigger zoom than desktop - the taller/centered canvas has the
    // headroom to support it, and it's what makes the character/obstacles read
    // as "bigger" on phones instead of just "taller empty sky". Desktop was
    // zoomed out 20% (1.4 -> 1.12) to show more of the scene.
    var ZOOM = IS_MOBILE ? 3.08 : 1.12;
    var ZOOM_PIVOT_X = PLAYER_X;
    var ZOOM_PIVOT_Y = GROUND_Y;

    function render() {
      ctx.save();
      ctx.translate(ZOOM_PIVOT_X, ZOOM_PIVOT_Y);
      ctx.scale(ZOOM, ZOOM);
      ctx.translate(-ZOOM_PIVOT_X, -ZOOM_PIVOT_Y);
      drawBackground();
      drawObstacles();
      drawPlayer();
      ctx.restore();
    }

    function loop(now) {
      var dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      if (state === 'running') {
        update(dt);
        updateHud();
      } else if (state === 'idle') {
        updateIdle(dt);
      } else if (state === 'dying') {
        dyingTimer -= dt;
        if (dyingTimer <= 0) finishDying();
      }
      render();
      requestAnimationFrame(loop);
    }

    if (pickerEl) {
      pickerEl.addEventListener('pointerdown', function (e) {
        var btn = e.target.closest('.runner-picker-btn');
        if (!btn) return;
        e.stopPropagation();
        var key = btn.getAttribute('data-char');
        if (!CHARACTERS[key] || key === selectedChar) return;
        selectedChar = key;
        pickerEl.querySelectorAll('.runner-picker-btn').forEach(function (b) {
          var isSel = b === btn;
          b.classList.toggle('is-selected', isSel);
          b.setAttribute('aria-pressed', isSel ? 'true' : 'false');
        });
      });
    }

    function isJumpKey(e) {
      return e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w' || e.key === 'W';
    }
    window.addEventListener('keydown', function (e) {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (isJumpKey(e)) {
        e.preventDefault();
        if (e.repeat) return;
        startJump();
      }
    });
    window.addEventListener('keyup', function (e) {
      if (isJumpKey(e)) releaseJump();
    });
    canvas.addEventListener('pointerdown', startJump);
    canvas.addEventListener('pointerup', releaseJump);
    canvas.addEventListener('pointercancel', releaseJump);
    canvas.addEventListener('pointerleave', releaseJump);
    if (overlayEl) {
      overlayEl.addEventListener('pointerdown', startJump);
      overlayEl.addEventListener('pointerup', releaseJump);
      overlayEl.addEventListener('pointercancel', releaseJump);
    }

    resetGame();
    lastTime = performance.now();
    requestAnimationFrame(loop);
  })();
  </script>

</body>
</html>
