  <!-- Payhip's embed loader - one copy per page, shared by every
       product's buy button below regardless of how many products
       this page lists. -->
  <script type="text/javascript" src="https://payhip.com/payhip.js"></script>
</head>
<body class="magazin">
  <div id="pageTransitionOverlay" class="page-transition-overlay"></div>
  <div class="page">
    <div data-include="../components/header.html"></div>

    <main>
      <section class="magazin-band">
        <div class="magazin-inner">
          <div class="magazin-heading">
            <h1>Магазин</h1>
            <p>Официален мърч на INTER(MISSION).</p>
          </div>

          <!--
            HOW TO ADD A REAL PRODUCT
            ──────────────────────────
            1. Create the product in your Payhip dashboard (Products → New product).
            2. Open it → Share / Embed → Embed Button tab → theme "None" →
               Get Your Embed Code. Payhip gives you an <a> tag with an
               href like https://payhip.com/b/AbCdE.
            3. Copy ONLY that href into the .magazin-card's buy link below
               (the payhip-buy-button + platform-link classes are already
               set up to match - don't change those, they're what makes
               Payhip's checkout popup work and keeps the button styled
               like every other button on the site).
            4. Swap the placeholder title/price for the real ones, and
               set the card's background image via the inline
               --product-image style, e.g.
               style="--product-image:url('../assets/images/magazin/tshirt-black.jpg')"
               (upload the image itself into assets/images/magazin/ first).
            5. Duplicate the whole .magazin-card block for each additional
               product - there's no limit and no build step, it's just
               plain HTML.

            This page currently has NO link in the site nav (by design,
            for now) - it's only reachable at /magazin directly. Add
            <a href="../magazin">Магазин</a> to components/header.html's
            .nav whenever it's ready to go public.
          -->
          <div class="magazin-grid">
            <div class="magazin-card">
              <div class="magazin-card-image" style="--product-image:url('')"></div>
              <h3 class="magazin-card-title">Тениска — лого</h3>
              <p class="magazin-card-price">от 40 лв.</p>
              <a href="https://payhip.com/b/REPLACE_ME" class="payhip-buy-button platform-link" data-theme="none">Купи</a>
            </div>

            <div class="magazin-card">
              <div class="magazin-card-image" style="--product-image:url('')"></div>
              <h3 class="magazin-card-title">Худи — лого</h3>
              <p class="magazin-card-price">от 80 лв.</p>
              <a href="https://payhip.com/b/REPLACE_ME" class="payhip-buy-button platform-link" data-theme="none">Купи</a>
            </div>

            <div class="magazin-card">
              <div class="magazin-card-image" style="--product-image:url('')"></div>
              <h3 class="magazin-card-title">Винил — cold summer</h3>
              <p class="magazin-card-price">от 60 лв.</p>
              <a href="https://payhip.com/b/REPLACE_ME" class="payhip-buy-button platform-link" data-theme="none">Купи</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div data-include="../components/footer.html"></div>
  </div>
  <script type="module" src="../assets/logo3d.js"></script>
  <script src="../assets/script.js" defer></script>
</body>
</html>
