<!-- Newsletter modal - opened via the small "Абонирай се" link next to
     the copyright in either footer variant below. Only one modal exists
     in the DOM regardless of which footer variant is currently visible. -->
<div id="newsletterModalOverlay" class="newsletter-modal-overlay" style="display:none;">
  <div class="newsletter-modal">
    <button type="button" class="newsletter-modal-close" id="newsletterModalCloseBtn" aria-label="Затвори">&times;</button>
    <p class="newsletter-label">Получавай известия за нови издания и артисти:</p>
    <form id="newsletterForm"
          action="https://mail.intermissionrec.com/newsletter/subscribe"
          method="POST"
          target="newsletter_hidden_iframe"
          class="newsletter-form">
      <input type="email" name="email" placeholder="Твоят имейл" required>

      <!-- Honeypot field - hidden from real users, bots usually fill it anyway -->
      <input type="text" name="website" style="position:absolute; left:-9999px;" tabindex="-1" autocomplete="off">
      <input type="hidden" name="startTime" id="newsletterStartTime" value="">

      <button type="submit" class="platform-link" id="newsletterSubmitBtn">Абонирай се</button>
    </form>
    <iframe name="newsletter_hidden_iframe" id="newsletter_hidden_iframe" style="display:none;"></iframe>
    <p id="newsletterStatus" class="newsletter-status" style="display:none;"></p>
  </div>
</div>

<!-- Cart drawer - present on every page (not just /magazin) via this
     shared footer, so the nav's cart icon can open it in place no
     matter where you're browsing. Relocated to a direct child of
     document.body at setup time in script.js, same as the newsletter
     modal above and for the same reason - escapes any transformed
     ancestor (Lenis included) that would otherwise trap this
     position:fixed overlay off-screen. Rendered by the shared cart
     logic in script.js, which reads/writes the 'intermission_cart'
     localStorage key and sources item names/prices from the
     #magazin-catalog block embedded in /magazin's own page (fetched
     on demand when needed from a page that isn't /magazin itself).

     #cartPaymentMethod / #cartCodFields: payment method choice, incl.
     cash-on-delivery. The whole section is hidden by default here
     since the cart starts empty on every page load, and shown by
     renderCartDrawer in script.js as soon as there's anything in the
     cart - card and COD both, for consistency, even when the cart
     isn't COD-eligible. The COD radio itself (#cartPayCod /
     #cartPayCodOption) is only ever enabled/selectable when EVERY
     item in the cart is physical; otherwise it's rendered disabled
     and greyed out (see .is-disabled in style.css) rather than
     removed, and script.js forces the selection back to card whenever
     that stops being true. The radios' change handler and the COD
     form's validation/submit branching also live in script.js. The
     server (handleShopCodCheckout in worker.js) re-checks the
     physical-only rule independently, so this markup's disabled state
     is a UX nicety, not the enforcement itself. -->
<div id="cartOverlay" class="cart-overlay" style="display:none;">
  <div class="cart-drawer">
    <div class="cart-drawer-header">
      <h2>Кошница</h2>
      <button type="button" id="cartCloseBtn" class="cart-close" aria-label="Затвори">&times;</button>
    </div>
    <div id="cartItemsList" class="cart-items"></div>
    <button type="button" id="cartClearBtn" class="cart-clear-btn">Изпразни кошницата</button>
    <div class="cart-drawer-footer">
      <div class="cart-total-row">
        <span>Общо</span>
        <span id="cartTotal">0 €</span>
      </div>

      <div id="cartPaymentMethod" class="cart-payment-method" style="display:none;">
        <label class="cart-payment-option">
          <input type="radio" name="cartPaymentMethod" id="cartPayCard" value="card" checked>
          <span>Плащане с карта</span>
        </label>
        <label class="cart-payment-option" id="cartPayCodOption">
          <input type="radio" name="cartPaymentMethod" id="cartPayCod" value="cod">
          <span>Наложен платеж <span class="cart-payment-option-note">(само за физически поръчки)</span></span>
        </label>
      </div>

      <div id="cartCodFields" class="cart-cod-fields" style="display:none;">
        <input type="text" id="cartCodName" class="cart-cod-input" placeholder="Три имена" autocomplete="name">
        <input type="email" id="cartCodEmail" class="cart-cod-input" placeholder="Имейл" autocomplete="email">
        <input type="tel" id="cartCodPhone" class="cart-cod-input" placeholder="Телефон" autocomplete="tel">
        <input type="text" id="cartCodLine1" class="cart-cod-input" placeholder="Адрес (улица, номер)" autocomplete="address-line1">
        <input type="text" id="cartCodLine2" class="cart-cod-input" placeholder="Адрес - продължение (по избор)" autocomplete="address-line2">
        <div class="cart-cod-row">
          <input type="text" id="cartCodCity" class="cart-cod-input" placeholder="Град" autocomplete="address-level2">
          <input type="text" id="cartCodPostal" class="cart-cod-input" placeholder="Пощ. код" autocomplete="postal-code">
        </div>
        <p class="cart-cod-note">Само за България. Плащаш в брой на куриера при получаване на пратката.</p>
      </div>

      <button type="button" id="cartCheckoutBtn" class="platform-link cart-checkout-btn">Плащане</button>
      <p id="cartStatus" class="cart-status" style="display:none;"></p>
    </div>
  </div>
</div>
