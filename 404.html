  <style>
    body.error-404 {
      --amber: #f2f2f2;
      --danger: #e05a4e;
      --face: #cccccc;
    }

    .error-404-band {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 24px 20px 36px;
      background: var(--bg-alt);
    }

    .error-404-inner {
      width: min(100%, 1200px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      text-align: center;
    }

    .error-404-eyebrow {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: clamp(3rem, 11vw, 5.5rem);
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--amber);
    }

    .error-404-copy h1 {
      margin: 6px 0 0;
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(1.5rem, 3.2vw, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .error-404-lead {
      margin: 12px auto 0;
      max-width: 520px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
    }

    .error-404-game {
      position: relative;
      width: 100%;
      max-width: 1200px;
      background: #060606;
      border-radius: var(--radius);
      overflow: hidden;
    }

    /* Long-pressing anywhere in the game (canvas, overlay text, picker
       thumbnails) was triggering the browser's native text-select/callout
       menu on mobile, which felt like a tap delay. Locking selection and the
       iOS callout down across the whole game area stops that. */
    .error-404-game,
    .error-404-game * {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
    }

    #runnerCanvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 800 / 300;
      touch-action: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      image-rendering: pixelated;
      /* Desaturates the whole scene (sprites, ground line, background) so it
         reads as true greyscale instead of the slightly blue/purple-tinted
         palette the character/ground colors had. */
      filter: grayscale(1);
    }

    .error-404-hud {
      position: absolute;
      top: 14px;
      right: 18px;
      display: flex;
      gap: 16px;
      font-family: 'Press Start 2P', monospace;
      font-weight: 400;
      font-size: 12px;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      color: rgba(242, 242, 242, .9);
      text-shadow: 0 1px 4px rgba(0, 0, 0, .6);
      pointer-events: none;
    }

    #runnerHiScore { color: var(--face); }
    #runnerHiScore.is-hidden { visibility: hidden; }

    .error-404-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 20px;
      text-align: center;
      background: rgba(6, 6, 6, .4);
      cursor: pointer;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }

    .error-404-overlay[hidden] { display: none; }

    .runner-overlay-title {
      margin: 0;
      font-family: 'Press Start 2P', monospace;
      font-weight: 400;
      font-size: clamp(0.9rem, 2.6vw, 1.3rem);
      line-height: 1.5;
      color: #fff;
      letter-spacing: 0;
    }

    .error-404-overlay p:not(.runner-overlay-title) {
      margin: 0;
      color: rgba(242, 242, 242, .85);
      font-family: 'Press Start 2P', monospace;
      font-weight: 400;
      font-size: 10px;
      line-height: 1.8;
      letter-spacing: 0;
    }

    .error-404-hint {
      margin: 0;
      color: var(--muted-2, #555);
      font-size: 13px;
    }

    .error-404-home-link {
      margin-top: 4px;
    }

    @media (max-width: 919.98px) {
      .error-404-band { padding: 56px 20px 72px; }
    }

    /* Mobile: taller/more-vertical game canvas (matches the JS mobile logical
       size below - both must stay in sync or the pixel art stretches). Overlay
       is also tightened up so its text has room inside the shorter box on
       narrow phones instead of overflowing past the game frame. */
    @media (max-width: 640px) {
      #runnerCanvas {
        aspect-ratio: 640 / 640;
      }
      .error-404-overlay {
        padding: 14px;
        gap: 6px;
      }
      .runner-picker {
        gap: 14px;
        margin: 2px 0 4px;
      }
      .runner-picker-thumb {
        width: 42px;
        height: 60px;
      }
    }

    .runner-picker {
      display: flex;
      gap: 18px;
      margin: 4px 0 8px;
    }

    .runner-picker-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px 14px 8px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(17, 17, 17, .8);
      color: var(--muted, #bfbfbf);
      font: inherit;
      cursor: pointer;
      transition: border-color .15s ease, color .15s ease, background .15s ease;
    }

    .runner-picker-btn:hover { border-color: rgba(255, 255, 255, .25); }

    .runner-picker-btn.is-selected {
      border-color: var(--amber);
      color: #fff;
      background: rgba(201, 201, 201, .14);
    }

    .runner-picker-thumb {
      width: 48px;
      height: 70px;
      background-repeat: no-repeat;
      background-position: center bottom;
      background-size: contain;
      image-rendering: pixelated;
      /* Match the canvas's greyscale treatment - these thumbnails are plain
         CSS background-images, so the canvas's own filter doesn't reach them. */
      filter: grayscale(1);
    }

    .runner-picker-label {
      font-family: 'Press Start 2P', monospace;
      font-weight: 400;
      font-size: 9px;
      line-height: 1.6;
      letter-spacing: 0;
      white-space: normal;
      max-width: 78px;
      text-align: center;
    }
  </style>

  <script>
    new Lenis({
      autoRaf: true,
      autoToggle: true,

      naiveDimensions: true,
      stopInertiaOnNavigate: true,
      duration: 1.44

  <script>
  (function () {
    var canvas = document.getElementById('runnerCanvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // Mobile gets a taller world space (more vertical framing) instead of the
    // desktop's wide/short one - keeps the same 800-wide world so obstacle
    // spawn/gap/speed math is untouched, only the vertical canvas is taller.
    // Must stay in sync with the "aspect-ratio: 640 / 640" mobile media query above
    // (800 / 800 reduces to the same 1:1 ratio, keeping the 800-wide world intact).
    var IS_MOBILE = window.matchMedia('(max-width: 640px)').matches;
    var LOGICAL_W = 800, LOGICAL_H = IS_MOBILE ? 800 : 300;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = LOGICAL_W * dpr;
    canvas.height = LOGICAL_H * dpr;
    ctx.scale(dpr, dpr);

    // On the square mobile frame, dead-centering the ground *line* leaves the
    // character (which stands on top of it, extending upward) looking too high -
    // only the line itself was centered. Nudging the line down by half the
    // character's on-screen height (~47 world px tall * 3.08 zoom) centers the
    // character + line together instead of just the line.
    var GROUND_Y = IS_MOBILE ? Math.round(LOGICAL_H / 2 + (47 * 3.08) / 2) : 232;
    var GRAVITY = 2200;
    // Tuned so each jump's peak height clears its intended obstacle with a modest
    // margin, instead of flying way higher than needed:
    //   - collision boxes are inset by 4px on every edge, so clearing an obstacle of
    //     height H only requires rising (H - 8) world units.
    //   - monitor (h=24) needs a rise of ~16 -> light tap now peaks at ~14, just under
    //     the monitor's clearance line, short of the mic stand.
    //   - mic stand (h=40) needs a rise of ~32 -> a held jump peaks at ~80 (clears both
    //     with room to spare).
    var JUMP_VELOCITY = -593;
    var LIGHT_JUMP_VELOCITY = -247;
    var SHORT_TAP_MAX = 1.0;
    var FAST_FALL_GRAVITY_MULT = 1.6;
    var BASE_SPEED = 220;
    var MAX_SPEED = 620;
    var SCORE_SPEED_STEP = 500;
    var SPEED_STEP = 40;
    var SCORE_DISTANCE_DIVISOR = 30;
    var SPEED_STAGE_DISTANCE = SCORE_SPEED_STEP * 6;
    var SCORE_MILESTONE_STEP = 100;
    var PLAYER_X = 90;

    var COLORS = {
      // Matches the characters' most consistent pixel color (their outline/silhouette
      // color, ~55,55,67 - identical across both run sheets and both jump sheets) so the
      // ground reads as part of the same palette instead of a plain white/gray line.
      // Alpha raised vs. the old white version to keep the same visibility against the
      // near-black background, since this color itself sits much closer to that
      // background than white does.

    var OBSTACLE_KEYS = Object.keys(OBSTACLE_TYPES);
    var MAX_OBSTACLE_LENGTH = 3;
    var MAX_OBSTACLE_DUPLICATION = 2;
    var GAP_COEFFICIENT = 0.6;
    var MAX_GAP_COEFFICIENT = 1.5;
    var SPEED_UNIT_FPS = 60;

    function duplicateObstacleCheck(type) {
      var count = 0;
      for (var i = 0; i < obstacleHistory.length; i++) {
        count = obstacleHistory[i] === type ? count + 1 : 0;
      }
      return count >= MAX_OBSTACLE_DUPLICATION;
    }

    function pickObstacleType() {
      for (var tries = 0; tries < 10; tries++) {
        var type = OBSTACLE_KEYS[Math.floor(Math.random() * OBSTACLE_KEYS.length)];
        if (!duplicateObstacleCheck(type)) return type;
      }
      return OBSTACLE_KEYS[Math.floor(Math.random() * OBSTACLE_KEYS.length)];
    }

    function spawnObstacle() {
      var type = pickObstacleType();
      var cfg = OBSTACLE_TYPES[type];

      obstacleHistory.unshift(type);
      if (obstacleHistory.length > 1) obstacleHistory.length = MAX_OBSTACLE_DUPLICATION;

      var size = 1 + Math.floor(Math.random() * MAX_OBSTACLE_LENGTH);
      if (size > 1 && speed < cfg.multipleSpeed) size = 1;

      var totalWidth = cfg.width * size;
      var ob = { type: type, x: LOGICAL_W + totalWidth, w: totalWidth, h: cfg.height, unitWidth: cfg.width, count: size };
      obstacles.push(ob);

      var speedFactor = speed / SPEED_UNIT_FPS;
      var minGap = Math.round(totalWidth * speedFactor + cfg.minGap * GAP_COEFFICIENT);
      var maxGap = Math.round(minGap * MAX_GAP_COEFFICIENT);
      nextSpawnAt = minGap + Math.random() * (maxGap - minGap);
    }

    function startGame() {
      resetGame();
      runCount++;
      state = 'running';
      if (overlayEl) overlayEl.hidden = true;
    }

    function die() {
      state = 'dying';
      dyingTimer = DEATH_FREEZE_SECONDS;
      if (score > hiScore) {
        hiScore = Math.floor(score);
        try { localStorage.setItem(HI_SCORE_KEY, String(hiScore)); } catch (e) {}
      }
      updateHud();
      beep(120, 0.35, 'sawtooth', 0.07);
    }

    function finishDying() {
      resetGame();
      if (overlayTitleEl) overlayTitleEl.textContent = 'GAME OVER';
      if (overlayTextEl) overlayTextEl.textContent = 'SPACE / Tap за нов опит';
      if (overlayEl) overlayEl.hidden = false;
    }

    function startJump() {
      if (state === 'idle') { startGame(); return; }
      if (state === 'dying') return;
      if (state === 'running' && player.onGround) {
        player.vy = JUMP_VELOCITY;
        player.onGround = false;
        player.jumpHeld = true;
        player.jumpPressTime = elapsed;
        player.fastFall = false;
        beep(560, 0.09, 'square', 0.045);
      }
    }

    function releaseJump() {
      if (!player || !player.jumpHeld) return;
      player.jumpHeld = false;
      var heldFor = elapsed - player.jumpPressTime;
      if (heldFor < SHORT_TAP_MAX && player.vy < 0) {
        if (player.vy < LIGHT_JUMP_VELOCITY) player.vy = LIGHT_JUMP_VELOCITY;
        player.fastFall = true;
      }
    }

    function updateIdle(dt) {
      groundOffset = (groundOffset + BASE_SPEED * dt) % 40;
      player.runTimer += dt;
      var frameInterval = 0.125;
      if (player.runTimer > frameInterval) {
        player.runTimer = 0;
        var frameCount = CHARACTERS[selectedChar].runFrames.length;
        player.runFrame = (player.runFrame + 1) % frameCount;
      }
    }

    function update(dt) {
      elapsed += dt;
      distance += speed * dt;
      score = distance / SCORE_DISTANCE_DIVISOR;
      var speedStage = Math.floor(distance / SPEED_STAGE_DISTANCE);
      speed = Math.min(MAX_SPEED, BASE_SPEED + speedStage * SPEED_STEP);

      var g = (player.fastFall && player.vy >= 0) ? GRAVITY * FAST_FALL_GRAVITY_MULT : GRAVITY;
      player.vy += g * dt;
      player.y += player.vy * dt;
      if (player.y >= GROUND_Y) {
        player.y = GROUND_Y;
        player.vy = 0;
        player.onGround = true;
        player.jumpHeld = false;
        player.fastFall = false;
      }

      if (player.onGround) {
        player.runTimer += dt;
        var frameInterval = 0.125;
        if (player.runTimer > frameInterval) {
          player.runTimer = 0;
          var frameCount = CHARACTERS[selectedChar].runFrames.length;
          player.runFrame = (player.runFrame + 1) % frameCount;
        }
      }

      groundOffset = (groundOffset + speed * dt) % 40;

      for (var i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= speed * dt;
        if (obstacles[i].x + obstacles[i].w < -20) obstacles.splice(i, 1);
      }
      nextSpawnAt -= speed * dt;
      if (nextSpawnAt <= 0) spawnObstacle();

      var m = 4;
      var px1 = PLAYER_X + m, px2 = PLAYER_X + player.w - m;
      var py1 = player.y - player.h + m, py2 = player.y - m;
      for (var j = 0; j < obstacles.length; j++) {
        var o = obstacles[j];
        var ox1 = o.x + m, ox2 = o.x + o.w - m;
        var oy1 = GROUND_Y - o.h + m, oy2 = GROUND_Y - m;
        if (px2 > ox1 && px1 < ox2 && py2 > oy1 && py1 < oy2) {
          die();
          break;
        }
      }

      var milestone = Math.floor(score / SCORE_MILESTONE_STEP) * SCORE_MILESTONE_STEP;
      if (milestone > 0 && milestone !== player.lastMilestone) {
        player.lastMilestone = milestone;
        playMilestoneChime();
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
      ctx.fillStyle = '#060606';
      ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

      ctx.strokeStyle = COLORS.line;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y + 1);
      ctx.lineTo(LOGICAL_W, GROUND_Y + 1);
      ctx.stroke();

      ctx.fillStyle = 'rgba(55,55,67,0.85)';
      for (var x = -groundOffset; x < LOGICAL_W; x += 40) {
        ctx.fillRect(x, GROUND_Y + 6, 18, 2);
      }
    }

    function drawPlayer() {
      var c = CHARACTERS[selectedChar];
      var img, frame, offset, sh;
      if (player.onGround) {
        img = runImages[selectedChar];
        var fi = player.runFrame % c.runFrames.length;
        frame = c.runFrames[fi];
        offset = (c.runOffsets && c.runOffsets[fi]) || 0;
        sh = c.runSheetH;
      } else {
        img = jumpImages[selectedChar];
        var ji = player.vy < 0 ? 0 : 1;
        frame = c.jumpFrames[ji];
        offset = (c.jumpOffsets && c.jumpOffsets[ji]) || 0;
        sh = c.jumpSheetH;
      }
      if (!img || !img.complete || !img.naturalWidth) return;

      // Each run frame keeps the artist's own vertical placement within the sheet
      // (sy stays 0, full sheetH is drawn every time) - that's what gives the run
      // cycle its natural 1px-ish bob, since some frames sit a pixel higher than
      // others in the source art. We only correct the horizontal anchor (offset).
      var sx = frame[0], sw = frame[1] - frame[0] + 1;
      var scale = 1.25;
      var dw = sw * scale, dh = sh * scale;
      // Not rounded: the per-frame offset above already lines every frame's content up
      // on the same fractional anchor. Rounding dx to a whole pixel here would re-add up
      // to ~1px of frame-to-frame jitter (rounding error differs per frame), which is
      // exactly the twitch this offset correction is meant to remove.
      var dx = PLAYER_X + player.w / 2 - dw / 2 + offset * scale;
      var dy = Math.round(player.y - dh);
      ctx.drawImage(img, sx, 0, sw, sh, dx, dy, dw, dh);
    }

    var MIC_NATIVE_W = 23, MIC_NATIVE_H = 68;
    var MONITOR_NATIVE_W = 18, MONITOR_NATIVE_H = 20;

    function drawObstacles() {
      obstacles.forEach(function (o) {
        var count = o.count || 1;
        var unitW = o.unitWidth || o.w;
        for (var i = 0; i < count; i++) {
          var slotX = o.x + i * unitW;
          if (o.type === 'monitor') {
            var img = monitorImg;
            if (!img.complete || !img.naturalWidth) continue;
            var dh = o.h, dw = dh * (MONITOR_NATIVE_W / MONITOR_NATIVE_H);
            var dx = slotX + unitW / 2 - dw / 2;
            var dy = GROUND_Y - dh;
            ctx.drawImage(img, 0, 0, MONITOR_NATIVE_W, MONITOR_NATIVE_H, dx, dy, dw, dh);
          } else {
            var img2 = micImg;
            if (!img2.complete || !img2.naturalWidth) continue;
            var dh2 = o.h, dw2 = dh2 * (MIC_NATIVE_W / MIC_NATIVE_H);
            var dx2 = slotX + unitW / 2 - dw2 / 2;
            var dy2 = GROUND_Y - dh2;
            ctx.drawImage(img2, 0, 0, MIC_NATIVE_W, MIC_NATIVE_H, dx2, dy2, dw2, dh2);
          }
        }
      });
    }

    // Camera zoom: renders the whole scene 40% bigger inside the same canvas, so the
    // action fills more of the frame instead of sitting in a lot of empty space. Anchored
    // on the player's x position and the ground line so neither drifts off-screen -
    // everything simply scales up around that point. Game logic (physics, spawn
    // positions, collisions) stays in the original 800x300 world space; only the picture
    // is zoomed.
    // Mobile gets a bigger zoom than desktop - the taller/centered canvas has the
    // headroom to support it, and it's what makes the character/obstacles read
    // as "bigger" on phones instead of just "taller empty sky". Desktop was
    // zoomed out 20% (1.4 -> 1.12) to show more of the scene.
    var ZOOM = IS_MOBILE ? 3.08 : 1.12;
    var ZOOM_PIVOT_X = PLAYER_X;
    var ZOOM_PIVOT_Y = GROUND_Y;

    function render() {
      ctx.save();
      ctx.translate(ZOOM_PIVOT_X, ZOOM_PIVOT_Y);
      ctx.scale(ZOOM, ZOOM);
      ctx.translate(-ZOOM_PIVOT_X, -ZOOM_PIVOT_Y);
      drawBackground();
      drawObstacles();
      drawPlayer();
      ctx.restore();
    }

    function loop(now) {
      var dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      if (state === 'running') {
        update(dt);
        updateHud();
      } else if (state === 'idle') {
        updateIdle(dt);
      } else if (state === 'dying') {
        dyingTimer -= dt;
        if (dyingTimer <= 0) finishDying();
      }
      render();
      requestAnimationFrame(loop);
    }

    if (pickerEl) {
      pickerEl.addEventListener('pointerdown', function (e) {
        var btn = e.target.closest('.runner-picker-btn');
        if (!btn) return;
        e.stopPropagation();
        var key = btn.getAttribute('data-char');
        if (!CHARACTERS[key] || key === selectedChar) return;
        selectedChar = key;
        pickerEl.querySelectorAll('.runner-picker-btn').forEach(function (b) {
          var isSel = b === btn;
          b.classList.toggle('is-selected', isSel);
          b.setAttribute('aria-pressed', isSel ? 'true' : 'false');
        });
      });
    }

    function isJumpKey(e) {
      return e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w' || e.key === 'W';
    }
    window.addEventListener('keydown', function (e) {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (isJumpKey(e)) {
        e.preventDefault();
        if (e.repeat) return;
        startJump();
      }
    });
    window.addEventListener('keyup', function (e) {
      if (isJumpKey(e)) releaseJump();
    });
    canvas.addEventListener('pointerdown', startJump);
    canvas.addEventListener('pointerup', releaseJump);
    canvas.addEventListener('pointercancel', releaseJump);
    canvas.addEventListener('pointerleave', releaseJump);
    if (overlayEl) {
      overlayEl.addEventListener('pointerdown', startJump);
      overlayEl.addEventListener('pointerup', releaseJump);
      overlayEl.addEventListener('pointercancel', releaseJump);
    }

    resetGame();
    lastTime = performance.now();
    requestAnimationFrame(loop);
  })();
  </script>

</body>
</html>
