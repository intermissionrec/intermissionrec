  <meta name="twitter:card" content="summary_large_image">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }

</head>
<body class="music">
  <div id="pageTransitionOverlay" class="page-transition-overlay"></div>
  <div class="page">
    <div data-include="../components/header.html"></div>

    <main>
      <section class="music-band" id="music">
        <div class="music-grid">

            <span class="music-title">cold summer</span>
          </a>

          <a class="music-card"
            href="https://intermissionrec.com/bandolero/"
            rel="noopener noreferrer"
            aria-label="BANDOLERO"
            style="--track-image: url('../assets/images/covers/20260724031341-bandolero.jpg')">
            <span class="music-title">BANDOLERO</span>
          </a>

          <a class="music-card"
            href="https://intermissionrec.com/vsichko/"
            rel="noopener noreferrer"
            aria-label="всичко"
            style="--track-image: url('../assets/images/covers/20260724031458-release.jpg')">
            <span class="music-title">всичко</span>
          </a>

          <a class="music-card"
            href="https://intermissionrec.com/nepoznati-ulici/"
            rel="noopener noreferrer"
            aria-label="непознати улици"
            style="--track-image: url('../assets/images/covers/20260724031515-release.jpg')">
            <span class="music-title">непознати улици</span>

          <a class="music-card"
            href="https://intermissionrec.com/redbul/"
            rel="noopener noreferrer"
            aria-label="редбул"
            style="--track-image: url('../assets/images/covers/20260724031534-release.jpg')">
            <span class="music-title">редбул</span>
          </a>

          <a class="music-card"
            href="https://intermissionrec.com/belya/"
            rel="noopener noreferrer"
            aria-label="БЕЛЯ"
            style="--track-image: url('../assets/images/covers/20260724031545-release.jpg')">
            <span class="music-title">БЕЛЯ</span>
          </a>

          <a class="music-card"
            href="https://intermissionrec.com/bez-snimki/"
            rel="noopener noreferrer"
            aria-label="БЕЗ СНИМКИ"
            style="--track-image: url('../assets/images/covers/20260824213554-bez-snimki.jpg')">
            <span class="music-title">БЕЗ СНИМКИ</span>
          </a>

          <a class="music-card"
            href="https://intermissionrec.com/koi-go-prai/"
            rel="noopener noreferrer"
            aria-label="КОЙ ГО ПРАЙ"

            <span class="music-title">КОЙ ГО ПРАЙ</span>
          </a>

          <a class="music-card"
            href="https://intermissionrec.com/legato/"
            rel="noopener noreferrer"
            aria-label="LEGATO"
            style="--track-image: url('../assets/images/covers/20260724031612-legato.jpg')">

          <a class="music-card"
            href="https://intermissionrec.com/instagram-modeli/"

            aria-label="INSTAGRAM МОДЕЛИ"

        </div>
      </section>
    </main>

    <div data-include="../components/footer.html"></div>
  </div>

  <script type="module" src="../assets/logo3d.js"></script>
  <script src="../assets/script.js" defer></script>

  <!-- Lenis smooth scroll (site-wide) -->
  <script src="https://unpkg.com/lenis@1.3.26/dist/lenis.min.js"></script>
  <script>
    new Lenis({
      autoRaf: true,
      autoToggle: true,
      anchors: true,
      allowNestedScroll: true,
      naiveDimensions: true,
      stopInertiaOnNavigate: true,
      duration: 1.44
    });
  </script>

  <!-- Smart Link quick-view modal -->
  <div id="smartlinkModal" class="sl-modal">
    <div class="sl-modal-backdrop"></div>
    <div class="sl-modal-content">
      <button class="sl-modal-close" aria-label="Затвори">&times;</button>
      <div class="sl-modal-left">
        <div class="sl-modal-cover">
          <img id="slModalCoverImg" src="" alt="">
        </div>
        <div class="sl-modal-info">
          <h2 id="slModalTitle"></h2>
          <p id="slModalArtist"></p>
        </div>
      </div>
      <div class="sl-modal-right" id="slModalLinks"></div>
    </div>
  </div>

  <script>
  (function () {
    var modal = document.getElementById('smartlinkModal');
    var closeBtn = modal.querySelector('.sl-modal-close');
    var backdrop = modal.querySelector('.sl-modal-backdrop');
    var coverImg = document.getElementById('slModalCoverImg');
    var titleEl = document.getElementById('slModalTitle');
    var artistEl = document.getElementById('slModalArtist');
    var linksEl = document.getElementById('slModalLinks');

    var prefetchCache = {};

    function renderModal(html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var coverSrc = doc.querySelector('.cover-card img');
      var title = doc.querySelector('.copy h1');
      var artist = doc.querySelector('.copy p');
      var platformLinks = doc.querySelectorAll('.music-links .platform-link');

      coverImg.src = coverSrc ? coverSrc.getAttribute('src') : '';
      coverImg.alt = title ? title.textContent : '';
      titleEl.textContent = title ? title.textContent : '';
      artistEl.textContent = artist ? artist.textContent : '';
      artistEl.style.display = (artist && artist.textContent) ? 'block' : 'none';

      linksEl.innerHTML = '';
      platformLinks.forEach(function (a) {
        var newA = document.createElement('a');
        newA.href = a.getAttribute('href');
        newA.className = 'platform-link';
        newA.target = '_blank';
        newA.rel = 'noopener noreferrer';
        newA.textContent = a.textContent;
        linksEl.appendChild(newA);
      });

      modal.classList.add('is-open');
      document.body.classList.add('modal-open');
      document.body.style.overflow = 'hidden';
    }

    function openModal(url) {
      // already prefetched - render instantly, no network wait at all
      if (prefetchCache[url]) {
        renderModal(prefetchCache[url]);
        return;
      }

      // not prefetched yet (e.g. clicked before background loading
      // finished) - fall back to fetching it live, same as before
      fetch(url)
        .then(function (res) {
          if (!res.ok) throw new Error('Failed to load');
          return res.text();
        })
        .then(function (html) {
          prefetchCache[url] = html;
          renderModal(html);
        })
        .catch(function () {
          // if anything goes wrong, fall back to a normal navigation
          window.location.href = url;
        });
    }

    function prefetchAllSmartLinks() {
      document.querySelectorAll('.music-card').forEach(function (card) {
        var url = card.getAttribute('href');
        if (!url || prefetchCache[url]) return;
        fetch(url)
          .then(function (res) {
            if (!res.ok) throw new Error('Failed to load');
            return res.text();
          })
          .then(function (html) {
            prefetchCache[url] = html;
          })
          .catch(function () {
            // silently ignore - openModal falls back to a live fetch
            // for this url if it's ever clicked
          });
      });
    }

    // Runs after the page transition overlay has already faded out
    // (700ms) rather than competing with it for load, so this doesn't
    // slow down the page feeling ready.
    setTimeout(prefetchAllSmartLinks, 1000);

    function closeModal() {
      modal.classList.remove('is-open');
      document.body.classList.remove('modal-open');
      document.body.style.overflow = '';
    }

    document.querySelectorAll('.music-card').forEach(function (card) {
      card.addEventListener('click', function (e) {
        e.preventDefault();
        openModal(card.getAttribute('href'));
      });
    });

    closeBtn.addEventListener('click', closeModal);
    backdrop.addEventListener('click', closeModal);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modal.classList.contains('is-open')) {
        closeModal();
      }
    });
  })();
  </script>
</body>
</html>
